<h1>Fee Structure</h1>
<p>The annual tuition fee for the academic year 2025-26 ranges from ₹4.5 Lakhs to ₹7.2 Lakhs per annum for day scholars.</p>

<p>Transport fee is ₹6,000 per month.</p>
