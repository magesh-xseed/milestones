<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>XSEED Education — Coming soon</title>
<link rel="icon" type="image/jpeg" href="./xseed-favicon.jpg" />
<meta name="description" content="A new xseededucation.com is on the way. Reach us at contact@xseededucation.com or on WhatsApp.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,200..700;1,9..144,200..700&family=Archivo:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#0E0B09;
    --ink-soft:#191411;
    --cream:#F6F1E7;
    --khaki:#C3A268;
    --ember:#E7A13C;
    --muted:#9A8D7D;
    --rule:rgba(246,241,231,.14);
    --display:"Fraunces","Iowan Old Style",Georgia,serif;
    --ui:"Archivo","Helvetica Neue",system-ui,sans-serif;
  }

  *{box-sizing:border-box;margin:0;padding:0}
  html{-webkit-text-size-adjust:100%}
  body{
    background:var(--ink);
    color:var(--cream);
    font-family:var(--ui);
    font-size:16px;
    line-height:1.55;
    -webkit-font-smoothing:antialiased;
    overflow:hidden;
  }
  a{color:inherit;text-decoration:none}
  :focus-visible{outline:2px solid var(--ember);outline-offset:4px;border-radius:2px}

  /* ---------- stage ---------- */
  .stage{
    position:relative;
    min-height:100dvh;
    display:grid;
    grid-template-columns:54fr 46fr;
    isolation:isolate;
    overflow:hidden;
  }

  .photo{position:absolute;inset:0;z-index:0;overflow:hidden;background:var(--ink)}
  .photo img{
    width:100%;height:100%;
    object-fit:cover;
    object-position:24% 42%;
    transform:scale(1.08);
    filter:brightness(.62) saturate(.82);
    animation:settle 2200ms cubic-bezier(.2,.7,.2,1) 120ms forwards;
  }
  @keyframes settle{
    to{transform:scale(1);filter:brightness(1) saturate(1)}
  }
  .scrim{
    position:absolute;inset:0;z-index:1;
    background:
      linear-gradient(97deg,
        rgba(14,11,9,0) 26%,
        rgba(14,11,9,.55) 44%,
        rgba(14,11,9,.88) 57%,
        rgba(14,11,9,.97) 72%),
      linear-gradient(to top, rgba(14,11,9,.55), rgba(14,11,9,0) 34%);
  }
  /* faint warm bloom behind the type, pulled from the photo's key light */
  .scrim::after{
    content:"";position:absolute;inset:0;
    background:radial-gradient(58% 44% at 84% 26%, rgba(231,161,60,.10), transparent 70%);
  }

  /* ---------- panel ---------- */
  .panel{
    position:relative;z-index:2;
    grid-column:2;
    display:flex;flex-direction:column;
    justify-content:center;
    gap:clamp(20px,2.4vh,32px);
    padding:clamp(26px,4vw,56px) clamp(28px,5.4vw,104px) clamp(22px,3vh,38px) 0;
    max-width:660px;
  }

  /* logo sits on its own white plate — the mark is drawn for light ground */
  .plate{
    align-self:flex-start;
    background:#fff;
    padding:14px 20px;
    border-radius:3px;
    box-shadow:0 18px 40px -22px rgba(0,0,0,.9);
  }
  .plate img{display:block;height:44px;width:auto}
  .plate .fallback{
    display:none;
    font-family:var(--display);
    font-variation-settings:"opsz" 100,"WONK" 1;
    font-weight:600;letter-spacing:.02em;
    color:#B4121B;font-size:26px;line-height:1.1;
  }
  .plate .fallback small{
    display:block;font-family:var(--ui);font-weight:500;
    font-size:9px;letter-spacing:.22em;text-transform:uppercase;color:#4A4A4A;
  }
  .plate.is-broken img{display:none}
  .plate.is-broken .fallback{display:block}

  .status{
    display:flex;align-items:center;gap:10px;
    font-size:11px;font-weight:600;letter-spacing:.2em;text-transform:uppercase;
    color:var(--khaki);
  }
  .dot{
    width:6px;height:6px;border-radius:50%;background:var(--ember);
    box-shadow:0 0 0 0 rgba(231,161,60,.6);
    animation:pulse 2.6s ease-out infinite;
  }
  @keyframes pulse{
    0%{box-shadow:0 0 0 0 rgba(231,161,60,.55)}
    70%{box-shadow:0 0 0 11px rgba(231,161,60,0)}
    100%{box-shadow:0 0 0 0 rgba(231,161,60,0)}
  }

  h1{
    font-family:var(--display);
    font-variation-settings:"opsz" 144,"SOFT" 0,"WONK" 1;
    font-weight:300;
    font-size:clamp(3.4rem,7.2vw,6.6rem);
    line-height:.9;
    letter-spacing:-.028em;
  }
  h1 em{
    font-style:italic;font-weight:400;color:var(--ember);
    font-variation-settings:"opsz" 144,"SOFT" 0,"WONK" 1;
  }

  .rule{
    height:1px;width:0;background:linear-gradient(90deg,var(--ember),rgba(231,161,60,0));
    animation:draw 1400ms cubic-bezier(.2,.7,.2,1) 900ms forwards;
  }
  @keyframes draw{to{width:min(320px,70%)}}

  .lede{
    max-width:42ch;
    font-size:clamp(15px,1.15vw,17px);
    color:#D8CFC0;
  }

  /* ---------- contact ---------- */
  .contact{list-style:none;border-top:1px solid var(--rule)}
  .contact li{border-bottom:1px solid var(--rule)}
  .contact a{
    display:grid;
    grid-template-columns:104px 1fr auto;
    align-items:baseline;
    gap:16px;
    padding:18px 4px;
    transition:background 220ms ease,padding 220ms ease;
  }
  .contact .label{
    font-size:10px;font-weight:600;letter-spacing:.22em;text-transform:uppercase;
    color:var(--muted);transition:color 220ms ease;
  }
  .contact .value{
    font-family:var(--display);
    font-variation-settings:"opsz" 40,"WONK" 0;
    font-weight:400;
    font-size:clamp(19px,1.9vw,25px);
    letter-spacing:-.01em;
    color:var(--cream);
    text-decoration-line:underline;
    text-decoration-color:rgba(246,241,231,.34);
    text-decoration-thickness:1px;
    text-underline-offset:.18em;
    transition:color 220ms ease;
    word-break:break-word;
  }
  .contact .arrow{
    font-size:18px;color:var(--muted);
    transform:translateX(-6px);opacity:0;
    transition:transform 260ms cubic-bezier(.2,.7,.2,1),opacity 260ms ease,color 220ms ease;
  }
  .contact a:hover{background:rgba(246,241,231,.045);padding-left:14px}
  .contact a:hover .value,.contact a:hover .arrow{color:var(--ember)}
  .contact a:hover .value{ text-decoration-color:rgba(177,90,54,.58) }
  .contact a:hover .label{color:var(--khaki)}
  .contact a:hover .arrow{transform:translateX(0);opacity:1}

  footer{
    display:flex;flex-wrap:wrap;gap:6px 18px;
    font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);
  }

  /* ---------- entrance ---------- */
  .reveal{opacity:0;transform:translateY(16px);animation:rise 900ms cubic-bezier(.2,.7,.2,1) forwards}
  .d1{animation-delay:.25s}.d2{animation-delay:.45s}.d3{animation-delay:.6s}
  .d4{animation-delay:.75s}.d5{animation-delay:.95s}.d6{animation-delay:1.15s}
  @keyframes rise{to{opacity:1;transform:none}}

  /* ---------- responsive ---------- */
  @media (max-width:900px){
    .stage{display:block;min-height:100dvh}
    .photo{position:relative;height:42dvh;min-height:220px}
    .photo img{object-position:50% 38%}
    .scrim{
      background:linear-gradient(to bottom, rgba(14,11,9,.25), rgba(14,11,9,0) 30%, rgba(14,11,9,.35) 62%, var(--ink) 99%);
    }
    .scrim::after{display:none}
    .panel{
      max-width:none;
      padding:0 22px 24px;
      margin-top:-20px;
      gap:18px;
    }
    .plate img{height:38px}
    .contact a{grid-template-columns:82px 1fr auto;gap:12px;padding:16px 2px}
    .contact a:hover{padding-left:6px}
  }
  @media (max-width:420px){
    .contact a{grid-template-columns:1fr auto;row-gap:4px}
    .contact .label{grid-column:1/-1}
  }

  @media (prefers-reduced-motion:reduce){
    *{animation:none!important;transition-duration:.01ms!important}
    .reveal{opacity:1;transform:none}
    .rule{width:min(320px,70%)}
    .photo img{transform:none;filter:none}
    .contact .arrow{opacity:1;transform:none}
  }
</style>
</head>
