<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>XSEED Education | Coming Soon</title>

  <script src="https://cdn.tailwindcss.com"></script>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Inter:wght@400;500;700;800;900&family=Manrope:wght@400;500;600;700;800&display=swap"
    rel="stylesheet">

  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            sans: ['Manrope', 'sans-serif'],
            serif: ['Cormorant Garamond', 'serif'],
          },
          colors: {
            xseed: {
              red: '#D61F1F',
              gold: '#B69863',
              cream: '#F4EEE4',
            }
          }
        }
      }
    }
  </script>

  <style>
    :root {
      color-scheme: dark;
    }

    body {
      background:
        radial-gradient(circle at 12% 24%, rgba(220, 151, 60, 0.24), transparent 22%),
        radial-gradient(circle at 85% 82%, rgba(0, 0, 0, 0.48), transparent 24%),
        #16110d;
    }

    .hero-shell {
      background-image:
        linear-gradient(180deg, rgba(0, 0, 0, 0.22) 0%, rgba(0, 0, 0, 0.36) 100%),
        linear-gradient(90deg, rgba(0, 0, 0, 0.27) 0%, rgba(0, 0, 0, 0.13) 42%, rgba(0, 0, 0, 0.29) 100%),
        url("bg-xseedmethod-2.png");
      background-size: cover;
      background-position: center center;
    }

    .hero-shell::before {
      content: "";
      position: absolute;
      inset: 0;
      background: radial-gradient(circle at 50% 14%, rgb(0 0 0 / 0.58), rgb(0 0 0 / 0.38) 32%, rgb(0 0 0 / 0.11) 62%, rgb(0 0 0 / 0.02) 78%), linear-gradient(180deg, rgb(0 0 0 / 0.16), rgb(0 0 0 / 0.22) 48%, rgb(0 0 0 / 0.27) 100%), radial-gradient(circle at 10% 28%, rgb(0 0 0 / 0.29), #00000000 22%);
      pointer-events: none;
    }

    .hero-stack {
      transform: translateY(-5vh);
    }

    .brand-lockup {
      margin-bottom: clamp(4.5rem, 7vw, 5.6rem);
    }

    .brand-title {
      font-size: clamp(5.75rem, 16.8vw, 12.8rem);
      font-weight: 800;
      line-height: 0.9;
      letter-spacing: -0.06em;
      text-transform: uppercase;
      color: #d61f1f;
    }

    .brand-tagline {
      margin-top: 0.5rem;
      color: rgb(255 255 255 / 0.88);
      font-size: clamp(1rem, 1.9vw, 1.8rem);
      font-weight: 500;
      line-height: 1.1;
      letter-spacing: 0.42em;
      text-transform: uppercase;
    }

    .coming-soon-title {
      margin: 0;
      color: white;
      font-size: clamp(2.2rem, 3.9vw, 3.8rem);
      font-weight: 900;
      letter-spacing: 0.04em;
      line-height: 0.92;
      text-transform: uppercase;
      font-family: "Inter", sans-serif;
      white-space: nowrap;
    }

    .support-copy {
      margin: 1.2rem auto 0;
      max-width: 42rem;
      color: rgb(255 255 255 / 0.72);
      font-size: clamp(1.5rem, 2vw, 1.75rem);
      font-weight: 400;
      line-height: 1.3;
    }

    .hero-footer {
      margin-top: auto;
      padding-top: 1.5rem;
      text-align: center;
    }

    .footer-contact {
      display: flex;
      justify-content: center;
      align-items: center;
      flex-wrap: wrap;
      gap: 0.75rem 1.1rem;
      color: rgb(255 255 255 / 58%);
      font-size: 0.9rem;
      line-height: 1.5;
    }

    .footer-contact a {
      color: inherit;
      text-decoration: none;
      transition: color 160ms ease;
    }

    .footer-contact a:hover,
    .footer-contact a:focus-visible {
      color: rgb(255 255 255 / 78%);
    }

    .footer-divider {
      width: 0.2rem;
      height: 0.2rem;
      border-radius: 999px;
      background: rgb(255 255 255 / 26%);
    }

    @media (max-width: 640px) {
      .hero-stack {
        transform: translateY(-2vh);
      }

      .brand-lockup {
        margin-bottom: 3.4rem;
      }

      .brand-tagline {
        margin-top: 0.35rem;
        letter-spacing: 0.3em;
      }

      .coming-soon-title {
        white-space: normal;
      }

      .support-copy {
        font-size: 1.25rem;
      }

      .footer-contact {
        flex-direction: column;
        gap: 0.45rem;
      }

      .footer-divider {
        display: none;
      }
    }
  </style>
</head>

<body class="min-h-screen overflow-x-hidden font-sans text-xseed-cream">
  <main class="min-h-screen">
    <section class="hero-shell relative min-h-screen overflow-hidden">
      <div class="relative z-10 flex min-h-screen flex-col px-6 py-8 md:px-12 md:py-10 lg:px-14 lg:py-12">
        <div class="flex flex-1 items-center justify-center">
          <div class="hero-stack mx-auto max-w-6xl text-center">
            <div class="brand-lockup">
              <div class="brand-title">
                XSEED
              </div>
              <p class="brand-tagline">
                Foundation For Life
              </p>
            </div>

            <h1 class="coming-soon-title">
              Coming Soon
            </h1>

            <!-- <p class="support-copy"> -->
            <p class="inline-block mt-4 px-4 py-1 border border-white/30 rounded-full text-white/80 text-[10px] sm:text-xs md:text-sm lg:text-[0.9rem] font-medium md:font-semibold tracking-[0.2em] uppercase">
              A new learning experience is on the way.
            </p>
          </div>
        </div>

        <footer class="hero-footer" aria-label="Contact details">
          <div class="footer-contact">
            <a href="mailto:contact@xseededucation.com">contact@xseededucation.com</a>
            <span class="footer-divider" aria-hidden="true"></span>
            <a href="https://wa.me/919560300571?text=Hi%2C%20I%20am%20interested%20to%20know%20more%20about%20XSEED%20Education."
              target="_blank" rel="noreferrer">WhatsApp us: +91 95603 00571</a>
          </div>
        </footer>

      </div>
    </section>

    <section id="next" class="sr-only">
      Next section placeholder
    </section>
  </main>
</body>

</html>
