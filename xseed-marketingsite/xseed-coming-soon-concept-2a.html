<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>XSEED Education | Coming Soon</title>
  <link rel="icon" type="image/jpeg" href="./xseed-favicon.jpg" />

  <script src="https://cdn.tailwindcss.com"></script>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Inter:wght@400;500;700;800;900&family=Manrope:wght@400;500;600;700;800&display=swap"
    rel="stylesheet">

  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            sans: ['Manrope', 'sans-serif'],
            serif: ['Cormorant Garamond', 'serif'],
          },
          colors: {
            xseed: {
              red: '#D61F1F',
              gold: '#B69863',
              cream: '#F4EEE4',
            }
          }
        }
      }
    }
  </script>

  <style>
    :root {
      color-scheme: dark;
      --ease-luxury: cubic-bezier(0.22, 1, 0.36, 1);
      --ease-soft: cubic-bezier(0.16, 1, 0.3, 1);
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      min-height: 100dvh;
      overflow: hidden;
      background:
        radial-gradient(circle at 12% 24%, rgba(220, 151, 60, 0.24), transparent 22%),
        radial-gradient(circle at 85% 82%, rgba(0, 0, 0, 0.48), transparent 24%),
        #16110d;
      animation: bodyFadeIn 1.2s var(--ease-luxury) both;
    }

    .hero-shell {
      position: relative;
      background-image:
        linear-gradient(180deg, rgba(18, 12, 8, 0.12) 0%, rgba(18, 12, 8, 0.24) 100%),
        linear-gradient(90deg, rgba(26, 17, 11, 0.28) 0%, rgba(18, 12, 8, 0.08) 42%, rgba(18, 12, 8, 0.24) 100%),
        url("bg-xseedmethod-1b.png");
      background-size: cover;
      background-position: center center;
      animation: heroScale 16s ease-in-out infinite alternate;
    }

    .hero-shell::before {
      content: "";
      position: absolute;
      inset: 0;
      /* background: radial-gradient(circle at 50% 14%, rgb(0 0 0 / 0.68), rgb(0 0 0 / 0.42) 32%, rgb(0 0 0 / 0.1) 62%, rgb(0 0 0 / 0) 78%), linear-gradient(180deg, rgb(0 0 0 / 0.16), rgb(0 0 0 / 0.22) 48%, rgb(0 0 0 / 0.3) 100%), radial-gradient(circle at 10% 28%, rgb(0 0 0 / 37%), #00000000 20%); */
      /* background: radial-gradient(circle at 50% 14%, rgb(0 0 0 / 52%), rgb(0 0 0 / 0%) 32%, rgb(0 0 0 / 0.1) 62%, rgb(0 0 0 / 0) 78%), linear-gradient(180deg, rgb(0 0 0 / 0%), rgb(0 0 0 / 0.22) 48%, rgb(0 0 0 / 27%) 100%), radial-gradient(circle at 10% 28%, rgb(0 0 0 / 0%), #00000000 20%); */
      background: radial-gradient(circle at 50% 14%, rgb(0 0 0 / 38%), rgb(0 0 0 / 31%) 32%, rgb(0 0 0 / 30%) 62%, rgb(0 0 0 / 26%) 78%), linear-gradient(180deg, rgb(0 0 0 / 30%), rgb(0 0 0 / 0%) 48%, rgb(0 0 0 / 29%) 100%), radial-gradient(circle at 10% 28%, rgb(0 0 0 / 0%), #00000000 20%);
      pointer-events: none;
      animation: overlayShift 14s ease-in-out infinite alternate;
    }

    .hero-shell::after {
      content: "";
      position: absolute;
      inset: -12%;
      background:
        radial-gradient(circle at 50% 50%, rgb(255 214 158 / 0.12), transparent 35%),
        radial-gradient(circle at 20% 24%, rgb(255 255 255 / 0.08), transparent 18%);
      mix-blend-mode: screen;
      opacity: 0.7;
      pointer-events: none;
      animation: ambientGlow 12s ease-in-out infinite alternate;
    }

    .hero-stack {
      transform: translateY(-2dvh);
      animation: riseIn 1.15s var(--ease-luxury) both;
      animation-delay: 120ms;
      will-change: transform, opacity;
    }

    .brand-lockup {
      margin-bottom: clamp(2.2rem, 4vw, 3.25rem);
      animation: riseIn 1.05s var(--ease-luxury) both;
      animation-delay: 220ms;
    }

    .brand-title {
      font-size: clamp(5.75rem, 16.8vw, 12.8rem);
      font-weight: 800;
      line-height: 0.9;
      letter-spacing: -0.06em;
      text-transform: uppercase;
      color: #d61f1f;
      text-shadow: 0 18px 40px rgb(0 0 0 / 0.3);
      animation: letterGlow 5s ease-in-out infinite;
    }

    .brand-tagline {
      margin-top: 0.5rem;
      color: rgb(255 255 255 / 0.88);
      font-size: clamp(1rem, 1.9vw, 1.8rem);
      font-weight: 500;
      line-height: 1.1;
      letter-spacing: 0.42em;
      text-transform: uppercase;
      opacity: 0;
      animation: fadeUp 0.9s var(--ease-soft) forwards;
      animation-delay: 420ms;
    }

    .coming-soon-title {
      margin: 0;
      color: white;
      font-size: clamp(2.2rem, 3.9vw, 3.8rem);
      font-weight: 900;
      letter-spacing: 0.04em;
      line-height: 0.92;
      text-transform: uppercase;
      font-family: "Inter", sans-serif;
      white-space: nowrap;
      text-shadow:
        0 10px 24px rgb(0 0 0 / 0.36),
        0 2px 8px rgb(0 0 0 / 0.22);
      opacity: 0;
      animation: fadeUp 0.95s var(--ease-soft) forwards;
      animation-delay: 560ms;
    }

    .support-copy {
      margin: 1.2rem auto 0;
      max-width: 42rem;
      color: rgb(255 255 255 / 0.72);
      font-size: clamp(1.5rem, 2vw, 1.75rem);
      font-weight: 400;
      line-height: 1.3;
    }

    .hero-pill {
      backdrop-filter: blur(14px);
      box-shadow: 0 12px 30px rgb(0 0 0 / 0.18);
      text-shadow:
        0 3px 10px rgb(0 0 0 / 0.52),
        0 1px 3px rgb(0 0 0 / 0.34);
      transition:
        transform 500ms var(--ease-soft),
        border-color 500ms var(--ease-soft),
        background-color 500ms var(--ease-soft),
        box-shadow 500ms var(--ease-soft);
      opacity: 0;
      animation: fadeUp 0.95s var(--ease-soft) forwards;
      animation-delay: 720ms;
    }

    .hero-pill:hover,
    .hero-pill:focus-visible {
      transform: translateY(-2px);
      border-color: rgb(255 255 255 / 0.44);
      background-color: rgb(255 255 255 / 0.08);
      box-shadow: 0 18px 44px rgb(0 0 0 / 0.22);
    }

    .hero-footer {
      margin-top: auto;
      padding-top: 1.5rem;
      text-align: center;
      opacity: 0;
      animation: footerFade 1s var(--ease-soft) forwards;
      animation-delay: 860ms;
    }

    .footer-contact {
      display: flex;
      justify-content: center;
      align-items: center;
      flex-wrap: wrap;
      gap: 0.75rem 1.1rem;
      color: rgb(255 255 255 / 58%);
      font-size: 0.9rem;
      line-height: 1.5;
    }

    .footer-contact a {
      color: inherit;
      text-decoration: none;
      transition:
        color 280ms var(--ease-soft),
        transform 280ms var(--ease-soft),
        opacity 280ms var(--ease-soft),
        text-decoration-color 280ms var(--ease-soft);
    }

    .footer-contact a[href^="mailto:"] {
      text-decoration-line: underline;
      text-decoration-color: rgb(255 255 255 / 0.34);
      text-decoration-thickness: 1px;
      text-underline-offset: 0.18em;
    }

    .footer-contact .wa-number {
      text-decoration-line: underline;
      text-decoration-color: rgb(255 255 255 / 0.34);
      text-decoration-thickness: 1px;
      text-underline-offset: 0.18em;
    }

    .footer-contact a:hover,
    .footer-contact a:focus-visible {
      color: rgb(255 255 255 / 78%);
      transform: translateY(-1px);
    }

    .footer-contact a:hover .wa-number,
    .footer-contact a:focus-visible .wa-number {
      text-decoration-color: rgb(255 255 255 / 0.62);
    }

    .footer-contact a[href^="mailto:"]:hover,
    .footer-contact a[href^="mailto:"]:focus-visible {
      text-decoration-color: rgb(255 255 255 / 0.62);
    }

    @keyframes bodyFadeIn {
      from {
        opacity: 0;
      }

      to {
        opacity: 1;
      }
    }

    @keyframes riseIn {
      from {
        opacity: 0;
        transform: translateY(calc(-2dvh + 30px));
      }

      to {
        opacity: 1;
        transform: translateY(-2dvh);
      }
    }

    @keyframes fadeUp {
      from {
        opacity: 0;
        transform: translateY(22px);
      }

      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    @keyframes footerFade {
      from {
        opacity: 0;
        transform: translateY(18px);
      }

      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    @keyframes heroScale {
      from {
        background-position: center center;
        transform: scale(1);
      }

      to {
        background-position: center 46%;
        transform: scale(1.035);
      }
    }

    @keyframes overlayShift {
      from {
        opacity: 0.92;
        transform: translate3d(0, 0, 0);
      }

      to {
        opacity: 1;
        transform: translate3d(0, -1.5%, 0);
      }
    }

    @keyframes ambientGlow {
      from {
        opacity: 0.4;
        transform: translate3d(-1.5%, 0, 0) scale(1);
      }

      to {
        opacity: 0.8;
        transform: translate3d(1.5%, -2%, 0) scale(1.04);
      }
    }

    @keyframes letterGlow {
      0%,
      100% {
        text-shadow: 0 18px 40px rgb(0 0 0 / 0.3);
      }

      50% {
        text-shadow: 0 22px 48px rgb(0 0 0 / 0.36);
      }
    }

    @media (prefers-reduced-motion: reduce) {
      html {
        scroll-behavior: auto;
      }

      *,
      *::before,
      *::after {
        animation: none !important;
        transition: none !important;
      }
    }

    .footer-divider {
      width: 0.2rem;
      height: 0.2rem;
      border-radius: 999px;
      background: rgb(255 255 255 / 26%);
    }

    @media (max-width: 640px) {
      .hero-stack {
        transform: none;
        animation-name: riseInMobile;
      }

      .brand-lockup {
        margin-bottom: 1.8rem;
      }

      .brand-tagline {
        margin-top: 0.35rem;
        letter-spacing: 0.3em;
      }

      .coming-soon-title {
        white-space: normal;
      }

      .support-copy {
        font-size: 1.25rem;
      }

      .footer-contact {
        flex-direction: column;
        gap: 0.45rem;
      }

      .footer-divider {
        display: none;
      }
    }

    @keyframes riseInMobile {
      from {
        opacity: 0;
        transform: translateY(24px);
      }

      to {
        opacity: 1;
        transform: translateY(0);
      }
    }
  </style>
</head>

<body class="h-dvh overflow-hidden font-sans text-xseed-cream">
  <main class="h-dvh">
    <section class="hero-shell relative h-dvh overflow-hidden">
      <div class="relative z-10 flex h-dvh flex-col px-6 py-5 md:px-12 md:py-6 lg:px-14 lg:py-8">
        <div class="flex flex-1 items-center justify-center">
          <div class="hero-stack mx-auto max-w-6xl text-center">
            <div class="brand-lockup">
              <div class="brand-title">
                XSEED
              </div>
              <p class="brand-tagline">
                Foundation For Life
              </p>
            </div>

            <h1 class="coming-soon-title">
              Coming Soon
            </h1>

            <!-- <p class="support-copy"> -->
            <p class="hero-pill inline-block mt-4 px-4 py-1 border border-white/30 rounded-full text-white/80 text-[10px] sm:text-xs md:text-sm lg:text-[0.9rem] font-medium md:font-bold tracking-[0.2em] uppercase">
              A new learning experience is on the way.
            </p>
          </div>
        </div>

        <footer class="hero-footer" aria-label="Contact details">
          <div class="footer-contact">
            <a href="mailto:contact@xseededucation.com">contact@xseededucation.com</a>
            <span class="footer-divider" aria-hidden="true"></span>
            <a href="https://wa.me/919560300571?text=Hi%2C%20I%20am%20interested%20to%20know%20more%20about%20XSEED%20Education."
              target="_blank" rel="noreferrer"><span class="wa-label">WhatsApp us:</span> <span class="wa-number">+91 95603 00571</span></a>
          </div>
        </footer>

      </div>
    </section>

    <section id="next" class="sr-only">
      Next section placeholder
    </section>
  </main>
</body>

</html>
