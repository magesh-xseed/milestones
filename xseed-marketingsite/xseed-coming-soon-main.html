<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>XSEED Education | Coming Soon</title>
    <link rel="icon" type="image/jpeg" href="./xseed-favicon.jpg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700;800;900&display=swap"
      rel="stylesheet"
    />
    <style>
      :root {
        --xseed-red: #c51f27;
        --text-dark: #171717;
        --text-soft: #4d5562;
        --white: #ffffff;
      }

      * {
        box-sizing: border-box;
      }

      html,
      body {
        margin: 0;
        min-height: 100%;
        background: var(--white);
        color: var(--text-dark);
        font-family: "Inter", sans-serif;
      }

      body {
        min-height: 100vh;
        overflow: hidden;
      }

      .page {
        min-height: 100vh;
        display: grid;
        grid-template-columns: 45fr 55fr;
      }

      .content-panel {
        background: var(--white);
        display: flex;
        align-items: center;
        justify-content: center;
      }

      .content-inner {
        width: min(100%, 42rem);
        min-height: 100vh;
        padding: clamp(2.5rem, 4vw, 4.5rem) clamp(1.75rem, 4.5vw, 5rem);
        display: flex;
        flex-direction: column;
        justify-content: space-between;
        align-items: center;
        gap: clamp(1rem, 1.6vw, 1.45rem);
        text-align: center;
        transform: translateY(-10vh);
      }

      .hero-copy {
        display: flex;
        flex: 1;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        gap: clamp(1rem, 1.6vw, 1.45rem);
      }

      .brand {
        width: min(30.75rem, 90%);
        margin: 0 0 clamp(0.4rem, 1vw, 0.8rem);
      }

      .brand img {
        display: block;
        width: 100%;
        height: auto;
      }

      .coming-soon {
        margin: 0;
        color: var(--white);
        font-size: clamp(2.7rem, 4.8vw, 4.75rem);
        font-weight: 900;
        letter-spacing: -0.045em;
        line-height: 0.88;
        text-transform: uppercase;
        font-family: "Inter", sans-serif;
        white-space: nowrap;
      }

      .message {
        margin: 0;
        max-width: 29rem;
        color: var(--text-soft);
        font-size: clamp(1rem, 0.88rem + 0.28vw, 1.08rem);
        line-height: 1.7;
        text-wrap: balance;
      }

      .contact-card {
        width: min(100%, 27rem);
        margin-top: auto;
        padding: 1.2rem 1.35rem;
        border: 1px solid rgba(197, 31, 39, 0.12);
        border-radius: 1.5rem;
        background:
          linear-gradient(180deg, rgba(255, 255, 255, 0.98), rgba(248, 244, 241, 0.96));
        box-shadow: 0 1.2rem 3rem rgba(23, 23, 23, 0.08);
        text-align: center;
      }

      .contact-title {
        margin: 0 0 0.8rem;
        font-size: 0.8rem;
        font-weight: 800;
        letter-spacing: 0.18em;
        text-transform: uppercase;
        color: var(--xseed-red);
      }

      .contact-email,
      .contact-link {
        display: block;
        width: 100%;
        font-size: clamp(0.98rem, 0.9rem + 0.2vw, 1.04rem);
        font-weight: 600;
        line-height: 1.55;
        text-decoration: none;
      }

      .contact-email {
        margin-bottom: 0.35rem;
        color: var(--text-dark);
      }

      .contact-link {
        color: var(--xseed-red);
      }

      .social-links {
        margin-top: 1rem;
        padding-top: 1rem;
        border-top: 1px solid rgba(23, 23, 23, 0.08);
        display: flex;
        flex-wrap: wrap;
        justify-content: center;
        gap: 0.7rem;
      }

      .social-link {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        min-width: 6.6rem;
        padding: 0.7rem 1rem;
        border-radius: 999px;
        background: #fff;
        color: var(--text-dark);
        border: 1px solid rgba(23, 23, 23, 0.08);
        font-size: 0.92rem;
        font-weight: 700;
        line-height: 1;
        text-decoration: none;
        transition:
          transform 180ms ease,
          box-shadow 180ms ease,
          border-color 180ms ease,
          color 180ms ease;
      }

      .contact-email:hover,
      .contact-email:focus-visible,
      .contact-link:hover,
      .contact-link:focus-visible {
        text-decoration: underline;
      }

      .social-link:hover,
      .social-link:focus-visible {
        transform: translateY(-1px);
        border-color: rgba(197, 31, 39, 0.24);
        box-shadow: 0 0.8rem 1.8rem rgba(197, 31, 39, 0.12);
        color: var(--xseed-red);
      }

      .image-panel {
        min-height: 100vh;
        overflow: hidden;
        background: #ece7df;
      }

      .image-panel img {
        width: 100%;
        height: 100%;
        object-fit: cover;
        object-position: 56% center;
        display: block;
      }

      @media (max-width: 1100px) {
        .page {
          grid-template-columns: 56fr 44fr;
        }

        .content-inner {
          width: min(100%, 38rem);
          padding-inline: clamp(1.4rem, 4vw, 3rem);
          transform: translateY(-7vh);
        }

        .coming-soon {
          font-size: clamp(2.35rem, 4.9vw, 4rem);
          white-space: normal;
        }

        .image-panel img {
          object-position: 58% center;
        }
      }

      @media (max-width: 980px) {
        body {
          overflow: auto;
        }

        .page {
          grid-template-columns: 1fr;
        }

        .content-panel {
          min-height: auto;
        }

        .content-inner {
          width: 100%;
          min-height: auto;
          padding: 2.5rem 1.5rem 2.25rem;
          transform: none;
        }

        .hero-copy {
          flex: initial;
        }

        .brand {
          width: min(18rem, 74%);
        }

        .coming-soon {
          font-size: clamp(2.15rem, 9vw, 3.6rem);
          white-space: normal;
        }

        .image-panel {
          min-height: 44vh;
        }

        .image-panel img {
          object-position: center 22%;
        }
      }

      @media (max-width: 560px) {
        .content-inner {
          gap: 0.95rem;
          padding: 2.1rem 1.25rem 1.9rem;
        }

        .brand {
          width: min(15.5rem, 72%);
        }

        .message {
          max-width: 21rem;
          font-size: 0.98rem;
        }

        .contact-card {
          width: min(100%, 21rem);
        }

        .image-panel {
          min-height: 35vh;
        }

        .contact-card {
          padding: 1rem;
          border-radius: 1.2rem;
        }

        .social-link {
          min-width: 0;
          flex: 1 1 calc(50% - 0.7rem);
        }
      }
    </style>
  </head>
  <body>
    <main class="page">
      <section class="content-panel">
        <div class="content-inner">
          <div class="hero-copy">
            <div class="brand">
              <img
                src="https://origin.xseededucation.com/wp-content/uploads/2021/09/XSEED_Logo_Core_tagline_white_bg-e1760008507335.png"
                alt="XSEED Education logo"
              />
            </div>

            <h1 class="coming-soon">Coming Soon</h1>
            <p class="message">
              We&rsquo;re building the next chapter of XSEED Education.
            </p>
          </div>

          <section class="contact-card" aria-label="Contact details">
            <p class="contact-title">Stay Connected</p>
            <a class="contact-email" href="mailto:contact@xseededucation.com"
              >contact@xseededucation.com</a
            >
            <a
              class="contact-link"
              href="https://wa.me/919560300571?text=Hi%2C%20I%20am%20interested%20to%20know%20more%20about%20XSEED%20Education."
              target="_blank"
              rel="noreferrer"
              aria-label="Chat with us on WhatsApp"
              >WhatsApp: +91 95603 00571</a
            >
            <div class="social-links" aria-label="Social links">
              <a
                class="social-link"
                href="https://www.youtube.com/@XSEEDEducationSingapore"
                target="_blank"
                rel="noreferrer"
                >YouTube</a
              >
              <a
                class="social-link"
                href="https://www.linkedin.com/company/xseededucation"
                target="_blank"
                rel="noreferrer"
                >LinkedIn</a
              >
              <a
                class="social-link"
                href="https://www.facebook.com/XSEEDEducation"
                target="_blank"
                rel="noreferrer"
                >Facebook</a
              >
            </div>
          </section>
        </div>
      </section>

      <section class="image-panel" aria-label="Coming soon visual">
        <img src="./leftside.png" alt="Portrait of a smiling child" />
      </section>
    </main>
  </body>
</html>
