<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>XSEED Academic Dashboard</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        :root {
            --wine-red: #7B0323;
            --amber-orange: #F49138;
        }
        body {
            font-family: 'Inter', sans-serif;
            background-color: #FBF9F7;
            color: #1C1917;
            overflow-x: hidden;
        }
        .bg-wine { background-color: var(--wine-red); }
        .text-wine { color: var(--wine-red); }
        .border-wine-5 { border-color: rgba(123, 3, 35, 0.05); }
        .bg-amber-light { background-color: rgba(244, 145, 56, 0.05); }
        .nav-button.active {
            background-color: white;
            color: var(--wine-red);
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
        }
        .focus-ring:focus-visible {
            outline: 3px solid rgba(244, 145, 56, 0.45);
            outline-offset: 3px;
        }
        .glass {
            background: rgba(255, 255, 255, 0.8);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
        }
        .orb {
            position: fixed;
            filter: blur(120px);
            z-index: -1;
            opacity: 0.04;
            pointer-events: none;
        }
        .pill-nav-shadow {
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.03);
        }
        /* Cinematic overlay for full-card images */
        .hero-gradient-overlay {
            background: linear-gradient(75deg, rgb(0 0 0 / 0.78) 0%, rgb(0 0 0 / 0.54) 42%, rgb(0 0 0 / 0) 100%);
        }
        .card-shadow {
            box-shadow: 0 30px 60px -12px rgba(28, 25, 23, 0.15);
        }
        @keyframes fade-in {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .today-fade-in {
            animation: fade-in 0.8s ease-out forwards;
        }
        .subject-card:hover {
            border-color: rgba(123, 3, 35, 0.2);
        }
        @media (prefers-reduced-motion: reduce) {
            *,
            *::before,
            *::after {
                animation-duration: 0.01ms !important;
                animation-iteration-count: 1 !important;
                scroll-behavior: auto !important;
                transition-duration: 0.01ms !important;
            }
        }
    </style>
</head>
<body class="overflow-x-hidden antialiased selection:bg-[#7b0323]/10">

    <!-- Decorative Blur Orbs -->
    <div class="orb top-[-10%] right-[-5%] w-[400px] h-[400px] bg-[#f59138]"></div>
    <div class="orb bottom-[-5%] left-[-5%] w-[300px] h-[300px] bg-[#7b0323]"></div>

    <!-- Header -->
    <header class="sticky top-0 z-50 w-full border-b border-wine-5 bg-white/70 px-6 backdrop-blur-xl md:px-12">
        <div class="max-w-[1600px] mx-auto h-24 flex items-center justify-between">
            <!-- Logo & Branding -->
            <div class="flex items-center gap-4">
                <div class="w-12 h-12 bg-wine rounded-2xl flex items-center justify-center shadow-xl shadow-[#7B0323]/20 transform rotate-3">
                    <i data-lucide="sparkles" class="text-[#F49138] w-6 h-6"></i>
                </div>
                <div class="flex flex-col">
                    <span class="text-wine text-2xl font-extrabold leading-none uppercase">XSEED</span>
                    <span class="text-[10px] font-semibold tracking-wide text-[#A08E8A] uppercase">Excellence</span>
                </div>
            </div>

            <!-- Navigation -->
            <nav class="hidden lg:flex items-center bg-amber-light p-1.5 rounded-[2rem] border border-wine-5" aria-label="Primary navigation">
                <button type="button" class="nav-button active focus-ring flex items-center gap-2 px-6 py-3 rounded-full transition-all duration-300 text-xs font-semibold uppercase tracking-wide" aria-current="page">
                    <i data-lucide="graduation-cap" class="w-4 h-4"></i>
                    <span>Teacher Lesson Plan</span>
                </button>
                <button type="button" class="nav-button focus-ring flex items-center gap-2 px-6 py-3 rounded-full transition-all duration-300 text-xs font-semibold uppercase tracking-wide text-[#6D5D5A] hover:text-wine">
                    <i data-lucide="home" class="w-4 h-4"></i>
                    <span>Parent Lesson Plan</span>
                </button>
                <button type="button" class="nav-button focus-ring flex items-center gap-2 px-6 py-3 rounded-full transition-all duration-300 text-xs font-semibold uppercase tracking-wide text-[#6D5D5A] hover:text-wine">
                    <i data-lucide="message-square" class="w-4 h-4"></i>
                    <span>Communication</span>
                </button>
                <button type="button" class="nav-button focus-ring flex items-center gap-2 px-6 py-3 rounded-full transition-all duration-300 text-xs font-semibold uppercase tracking-wide text-[#6D5D5A] hover:text-wine">
                    <i data-lucide="line-chart" class="w-4 h-4"></i>
                    <span>Learnometer</span>
                </button>
                <button type="button" class="nav-button focus-ring flex items-center gap-2 px-6 py-3 rounded-full transition-all duration-300 text-xs font-semibold uppercase tracking-wide text-[#6D5D5A] hover:text-wine">
                    <i data-lucide="dumbbell" class="w-4 h-4"></i>
                    <span>Practice Gym</span>
                </button>
            </nav>

            <!-- Actions -->
            <div class="flex items-center gap-6">
                <button type="button" class="focus-ring group hidden items-center gap-3 rounded-2xl pr-4 text-left transition-all hover:bg-[#7B0323]/5 xl:flex" aria-label="Open profile">
                    <div class="text-right">
                        <p class="text-sm font-bold text-wine">Venkateswaran</p>
                        <p class="text-[10px] font-medium text-[#A08E8A]">Academic Lead</p>
                    </div>
                    <div class="w-12 h-12 rounded-2xl border-2 border-[#7B0323]/10 p-1 group-hover:border-[#7B0323]/40 transition-all">
                        <img src="https://api.dicebear.com/7.x/avataaars/svg?seed=Felix" alt="User" class="w-full h-full rounded-xl object-cover bg-[#FFF0DE]">
                    </div>
                </button>
                <button type="button" class="focus-ring hidden p-3 text-wine bg-[#7B0323]/5 rounded-2xl transition-all hover:bg-[#7B0323]/10 md:block" aria-label="Open notifications">
                    <i data-lucide="bell" class="w-5 h-5"></i>
                </button>
                <button type="button" class="focus-ring lg:hidden p-2 text-wine" id="menuToggle" aria-label="Open navigation menu" aria-expanded="false">
                    <i data-lucide="menu" class="w-7 h-7"></i>
                </button>
            </div>
        </div>
        <nav id="mobileMenu" class="hidden border-t border-wine-5 pb-5 lg:hidden" aria-label="Mobile navigation">
            <div class="grid gap-2 rounded-[1.5rem] bg-amber-light p-2">
                <button type="button" class="nav-button active focus-ring flex items-center gap-3 rounded-2xl px-4 py-3 text-left text-xs font-semibold uppercase tracking-wide" aria-current="page">
                    <i data-lucide="graduation-cap" class="h-4 w-4"></i>
                    <span>Teacher Lesson Plan</span>
                </button>
                <button type="button" class="nav-button focus-ring flex items-center gap-3 rounded-2xl px-4 py-3 text-left text-xs font-semibold uppercase tracking-wide text-[#6D5D5A] hover:bg-white hover:text-wine">
                    <i data-lucide="home" class="h-4 w-4"></i>
                    <span>Parent Lesson Plan</span>
                </button>
                <button type="button" class="nav-button focus-ring flex items-center gap-3 rounded-2xl px-4 py-3 text-left text-xs font-semibold uppercase tracking-wide text-[#6D5D5A] hover:bg-white hover:text-wine">
                    <i data-lucide="message-square" class="h-4 w-4"></i>
                    <span>Communication</span>
                </button>
                <button type="button" class="nav-button focus-ring flex items-center gap-3 rounded-2xl px-4 py-3 text-left text-xs font-semibold uppercase tracking-wide text-[#6D5D5A] hover:bg-white hover:text-wine">
                    <i data-lucide="line-chart" class="h-4 w-4"></i>
                    <span>Learnometer</span>
                </button>
                <button type="button" class="nav-button focus-ring flex items-center gap-3 rounded-2xl px-4 py-3 text-left text-xs font-semibold uppercase tracking-wide text-[#6D5D5A] hover:bg-white hover:text-wine">
                    <i data-lucide="dumbbell" class="h-4 w-4"></i>
                    <span>Practice Gym</span>
                </button>
            </div>
        </nav>
    </header>

    <main class="max-w-[1280px] mx-auto px-6 py-12">
        
        <!-- Updated Continue Lesson Section -->
        <section class="mb-16 today-fade-in">

            <section class="relative rounded-[3rem] overflow-hidden card-shadow group h-[420px]">
                <!-- Background Image Covering Entire Card with Top Alignment -->
                <img
                    src="assets/light-shadow.jpeg"
                    class="absolute inset-0 w-full h-full object-cover object-top transition-transform duration-1000 group-hover:scale-105"
                    alt="Light and Shadows"
                />
                
                <!-- Dark Gradient Overlay for Readability -->
                <div class="absolute inset-0 hero-gradient-overlay"></div>

                <!-- Content Layer -->
                <div class="absolute inset-0 p-8 md:p-12 flex flex-col justify-end">
                    
                    <div class="flex flex-col md:flex-row md:items-end justify-between gap-6">
                        <div class="max-w-2xl">
                            <span class="inline-flex items-center gap-2 px-4 py-1.5 bg-[var(--amber-orange)] text-white rounded-full text-[10px] font-bold uppercase tracking-wide shadow-xl mb-6">
                                <i data-lucide="play-circle" class="w-3.5 h-3.5"></i>
                                Science. Grade 4 - Block 01
                            </span>
                            <h1 class="text-4xl md:text-5xl font-extrabold text-white mb-4 leading-tight uppercase">
                                Light and <br/>Shadows
                            </h1>
                            <div class="max-w-2xl space-y-2 text-white/85">
                                <p class="text-base md:text-lg font-semibold">
                                    Changes in the Sky Across the Day
                                </p>
                                <p class="max-w-xl text-sm md:text-base font-medium leading-6 text-white/75">
                                    Explain why the Sun appears to move in the sky and how it affects the length and rhythm of a day.
                                </p>
                            </div>
                        </div>

                        <!-- Action Row -->
                        <div class="flex flex-col items-end gap-5">
                            <div class="flex items-center gap-4 bg-black/40 backdrop-blur-md px-5 py-3 rounded-2xl border border-white/10">
                                <div class="h-1.5 w-24 bg-white/20 rounded-full overflow-hidden" role="progressbar" aria-valuenow="45" aria-valuemin="0" aria-valuemax="100" aria-label="Lesson progress 45% complete">
                                    <div class="h-full bg-[#f59138] rounded-full shadow-[0_0_10px_#f59138]" style="width: 45%"></div>
                                </div>
                                <span class="text-[10px] font-bold text-white tracking-wide uppercase">45% Progress</span>
                            </div>

                            <button
                                type="button"
                                class="focus-ring bg-white text-[#1C1917] px-10 py-5 rounded-2xl font-bold flex items-center gap-3 transition-all shadow-2xl hover:bg-[#f59138] hover:text-white hover:-translate-y-1 active:scale-95"
                            >
                                Continue Lesson
                                <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="currentColor"><polygon points="5 3 19 12 5 21 5 3"/></svg>
                            </button>
                        </div>
                    </div>
                </div>
            </section>
        </section>

        <!-- JSON-driven Curriculum Sections -->
        <section id="curriculum-sections" class="space-y-16"></section>
    </main>

    <script>
        const currentGradeId = 'grade-4';
        const expandedGradeIds = new Set([currentGradeId]);
        const collapsedBlockIds = new Set();

        const iconPaths = {
            book: '<path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"/>',
            math: '<rect x="3" y="3" width="18" height="18" rx="2" ry="2"/><line x1="8" y1="12" x2="16" y2="12"/><line x1="12" y1="8" x2="12" y2="16"/>',
            globe: '<circle cx="12" cy="12" r="10"/><path d="M12 2a14.5 14.5 0 0 0 0 20 14.5 14.5 0 0 0 0-20"/><path d="M2 12h20"/>',
            monitor: '<rect width="20" height="14" x="2" y="3" rx="2"/><line x1="8" x2="16" y1="21" y2="21"/><line x1="12" x2="12" y1="17" y2="21"/>',
            flask: '<path d="M10 2v7.31"/><path d="M14 9.3V2"/><path d="M8.5 2h7"/><path d="M14 9.3 20.4 20a1.3 1.3 0 0 1-1.1 2H4.7a1.3 1.3 0 0 1-1.1-2L10 9.31"/><path d="M8.5 14h7"/>',
            landmark: '<line x1="3" x2="21" y1="22" y2="22"/><line x1="6" x2="6" y1="18" y2="11"/><line x1="10" x2="10" y1="18" y2="11"/><line x1="14" x2="14" y1="18" y2="11"/><line x1="18" x2="18" y1="18" y2="11"/><polygon points="12 2 20 7 4 7 12 2"/>',
            hindi: '<path d="M4 4h16"/><path d="M7 4v16"/><path d="M7 12h5a4 4 0 0 0 0-8"/><path d="M17 4v16"/>',
            early: '<path d="M12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"/>'
        };

        const subjectLibrary = {
            earlyChildhood: {
                name: 'Early Childhood',
                subtitle: 'Foundation Plan',
                progress: 40,
                icon: 'early'
            },
            english: {
                name: 'English',
                subtitle: 'Curriculum Plan',
                progress: 65,
                icon: 'book'
            },
            computerScience: {
                name: 'Computer Science',
                subtitle: 'Curriculum Plan',
                progress: 48,
                icon: 'monitor'
            },
            mathematics: {
                name: 'Mathematics',
                subtitle: 'Curriculum Plan',
                progress: 30,
                icon: 'math'
            },
            science: {
                name: 'Science',
                subtitle: 'Curriculum Plan',
                progress: 45,
                icon: 'flask'
            },
            evs: {
                name: 'EVS',
                subtitle: 'Curriculum Plan',
                progress: 10,
                icon: 'globe'
            },
            social: {
                name: 'Social',
                subtitle: 'Curriculum Plan',
                progress: 36,
                icon: 'landmark'
            },
            hindi: {
                name: 'Hindi',
                subtitle: 'Curriculum Plan',
                progress: 58,
                icon: 'hindi'
            }
        };

        const primarySubjects = [
            subjectLibrary.computerScience,
            subjectLibrary.evs,
            subjectLibrary.english,
            subjectLibrary.science,
            subjectLibrary.social,
            subjectLibrary.mathematics,
            subjectLibrary.hindi
        ];

        function renderIcon(iconName) {
            return `
                <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                    ${iconPaths[iconName]}
                </svg>
            `;
        }

        function renderWatermarkIcon(iconName) {
            return `
                <svg xmlns="http://www.w3.org/2000/svg" width="80" height="80" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                    ${iconPaths[iconName]}
                </svg>
            `;
        }

        const blockTitleLibrary = {
            'Computer Science': ['Digital Basics', 'Parts of a Computer', 'Using the Keyboard', 'Mouse Skills', 'File and Folder Basics', 'Drawing with Shapes', 'Internet Safety', 'Sequencing Steps', 'Pattern Logic', 'Simple Algorithms', 'Creative Coding', 'Debugging Basics', 'Data Around Us', 'Presentation Skills', 'Digital Citizenship'],
            EVS: ['My Surroundings', 'My Family', 'Food We Eat', 'Water Around Us', 'Plants Near Us', 'Animals Around Us', 'Our Body', 'Good Habits', 'Weather Around Us', 'Homes and Shelter', 'People Who Help Us', 'Festivals and Places', 'Travel and Transport', 'Keeping Clean', 'Caring for Nature'],
            English: ['The Alphabet Song', 'Letter Sounds', 'Sight Words', 'Reading Fluency', 'Rhyming Words', 'Nouns Around Us', 'Action Words', 'Describing Words', 'Sentence Builders', 'Listening for Details', 'Story Characters', 'Story Setting', 'Picture Reading', 'Writing Workshop', 'Speaking with Confidence'],
            Science: ['Light and Shadows', 'Changes in the Sky', 'Materials Around Us', 'Solids and Liquids', 'Plants Grow', 'Animal Needs', 'Human Body', 'Healthy Habits', 'Forces and Motion', 'Sound Around Us', 'Water Cycle Basics', 'Weather Watch', 'Magnets', 'Simple Machines', 'Observing Like Scientists'],
            Social: ['My Community', 'My School', 'Rules and Responsibilities', 'Maps and Places', 'Directions Around Us', 'Our Neighborhood', 'Helpers at Work', 'Culture and Heritage', 'Festivals We Celebrate', 'Food and Clothing', 'Transport and Travel', 'Public Places', 'Our Country', 'Good Citizenship', 'Saving Resources'],
            Mathematics: ['Numbers and Patterns', 'Counting Forward', 'Comparing Numbers', 'Place Value', 'Addition Stories', 'Subtraction Stories', 'Shapes Around Us', 'Geometry in Life', 'Measurement', 'Time of Day', 'Money Basics', 'Data and Pictures', 'Patterns in Nature', 'Fractions as Parts', 'Problem Solving'],
            Hindi: ['Swar Pehchan', 'Vyanjan Pehchan', 'Matra Abhyas', 'Pathan Kaushal', 'Shabd Nirman', 'Vakya Rachna', 'Vyakaran', 'Kahani Pathan', 'Kavita Pathan', 'Shravan Kaushal', 'Baatcheet', 'Chitra Varnan', 'Rachnatmak Lekhan', 'Muhavare', 'Punravartan'],
            'Early Childhood': ['Stories and Sounds', 'Colors Around Me', 'Numbers and Shapes', 'Fine Motor Fun', 'Big and Small', 'My Body', 'My Family', 'Animals and Sounds', 'Fruits and Vegetables', 'Weather Play', 'Good Habits', 'Sharing and Caring', 'Music and Movement', 'World Around Me', 'Creative Play']
        };

        const lessonTypes = [
            {
                title: 'Warm Up',
                duration: '20 min',
                stage: 'warm',
                icon: 'sun',
                description: (topic) => `Activate prior ideas and invite quick observations about ${topic.toLowerCase()}.`
            },
            {
                title: 'Explore',
                duration: '35 min',
                stage: 'explore',
                icon: 'search',
                description: (topic) => `Students investigate examples and notice patterns before formal naming.`
            },
            {
                title: 'Teacher Model',
                duration: '30 min',
                stage: 'practice',
                icon: 'presentation',
                description: (topic) => `Model the thinking moves students need for ${topic.toLowerCase()}.`
            },
            {
                title: 'Guided Practice',
                duration: '40 min',
                stage: 'practice',
                icon: 'pencil-ruler',
                description: () => 'Practice together with prompts, checks, and visible teacher support.'
            },
            {
                title: 'Activity Lab',
                duration: '35 min',
                stage: 'practice',
                icon: 'flask-conical',
                description: () => 'Hands-on task that turns the idea into observable classroom evidence.'
            },
            {
                title: 'Check Understanding',
                duration: '25 min',
                stage: 'explore',
                icon: 'list-checks',
                description: () => 'Quick check for misconceptions before students move to independent work.'
            },
            {
                title: 'Apply',
                duration: '30 min',
                stage: 'apply',
                icon: 'arrow-up-right',
                description: () => 'Use the idea in a fresh situation with a clear success target.'
            },
            {
                title: 'Reflect',
                duration: '20 min',
                stage: 'reflect',
                icon: 'sparkles',
                description: () => 'Close the learning loop with evidence, explanation, and next steps.'
            }
        ];

        function getStatus(progress) {
            if (progress >= 90) return 'Completed';
            if (progress > 0) return 'In Progress';
            return 'Not Started';
        }

        function getStatusClass(status) {
            if (status === 'Completed') return 'bg-[#4CAF50]/10 text-[#2E7D32] border-[#4CAF50]/20';
            if (status === 'In Progress') return 'bg-[#f59138]/10 text-[#b75d13] border-[#f59138]/20';
            return 'bg-[#F5F5F4] text-[#78716C] border-[#E7E5E4]';
        }

        function getSubjectBlocks(subject, gradeIndex, subjectIndex) {
            const titles = blockTitleLibrary[subject.name] || Array.from({ length: 15 }, (_, index) => `${subject.name} Block ${index + 1}`);
            return titles.slice(0, 15).map((title, blockIndex) => {
                const progress = Math.max(0, Math.min(100, subject.progress + ((gradeIndex - 3) * 4) - (blockIndex * 4) + (subjectIndex * 3)));
                const lessons = lessonTypes.map((lesson, lessonIndex) => {
                    const lessonProgress = Math.max(0, Math.min(100, progress - (lessonIndex * 8)));
                    return {
                        id: `lesson-${lessonIndex + 1}`,
                        title: lesson.title,
                        description: lesson.description(title),
                        duration: lesson.duration,
                        stage: lesson.stage,
                        icon: lesson.icon,
                        progress: lessonProgress,
                        status: getStatus(lessonProgress)
                    };
                });
                return {
                    id: `block-${blockIndex + 1}`,
                    title,
                    progress,
                    status: getStatus(progress),
                    lessons
                };
            });
        }

        function getSubjectSummary(subject) {
            const blocks = subject.blocks || [];
            const lessons = blocks.flatMap((block) => block.lessons.map((lesson) => ({
                ...lesson,
                blockId: block.id,
                blockTitle: block.title
            })));
            const lastLesson = lessons.find((lesson) => lesson.status === 'In Progress') || lessons.find((lesson) => lesson.status === 'Completed') || lessons[0];

            return {
                totalBlocks: blocks.length,
                totalLessons: lessons.length,
                lastOpened: lastLesson ? lastLesson.blockTitle : 'No lesson opened',
                lastBlockId: lastLesson ? lastLesson.blockId : blocks[0]?.id,
                status: getStatus(subject.progress)
            };
        }

        function buildGrade(id, title, sourceSubjects, gradeIndex) {
            return {
                id,
                title,
                subjects: sourceSubjects.map((subject, subjectIndex) => {
                    const progress = Math.max(0, Math.min(100, subject.progress + ((gradeIndex - 3) * 4) + (subjectIndex * 2)));
                    const subjectWithProgress = { ...subject, progress };
                    return {
                        ...subjectWithProgress,
                        id: subject.name.toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/(^-|-$)/g, ''),
                        grade: title,
                        blocks: getSubjectBlocks(subjectWithProgress, gradeIndex, subjectIndex)
                    };
                })
            };
        }

        const curriculumByGrade = [
            buildGrade('nursery', 'Nursery', [subjectLibrary.earlyChildhood], 0),
            buildGrade('lkg', 'Lower Kindergarten (LKG)', [subjectLibrary.earlyChildhood], 1),
            buildGrade('ukg', 'Upper Kindergarten (UKG)', [subjectLibrary.earlyChildhood], 2),
            ...Array.from({ length: 8 }, (_, index) => buildGrade(`grade-${index + 1}`, `Grade ${index + 1}`, primarySubjects, index + 3))
        ];
        curriculumByGrade.forEach((grade) => expandedGradeIds.add(grade.id));

        function findGrade(gradeId) {
            return curriculumByGrade.find((grade) => grade.id === gradeId);
        }

        function findSubject(gradeId, subjectId) {
            const grade = findGrade(gradeId);
            return grade ? grade.subjects.find((subject) => subject.id === subjectId) : null;
        }

        function findBlock(gradeId, subjectId, blockId) {
            const subject = findSubject(gradeId, subjectId);
            return subject ? subject.blocks.find((block) => block.id === blockId) : null;
        }

        function renderProgress(value, color = 'var(--wine-red)') {
            const safeValue = Math.max(0, Math.min(100, Number(value) || 0));
            return `
                <div class="h-1.5 w-full bg-[#F5F5F4] rounded-full overflow-hidden" role="progressbar" aria-valuenow="${safeValue}" aria-valuemin="0" aria-valuemax="100" aria-label="${safeValue}% complete">
                    <div class="h-full rounded-full" style="width: ${safeValue}%; background: ${color};"></div>
                </div>
            `;
        }

        function getStageStyle(stage) {
            const styles = {
                warm: {
                    badge: 'bg-amber-50 text-amber-700 border-amber-100',
                    icon: 'bg-amber-100 text-amber-700',
                    ring: 'group-hover:border-amber-200'
                },
                explore: {
                    badge: 'bg-sky-50 text-sky-700 border-sky-100',
                    icon: 'bg-sky-100 text-sky-700',
                    ring: 'group-hover:border-sky-200'
                },
                practice: {
                    badge: 'bg-emerald-50 text-emerald-700 border-emerald-100',
                    icon: 'bg-emerald-100 text-emerald-700',
                    ring: 'group-hover:border-emerald-200'
                },
                apply: {
                    badge: 'bg-violet-50 text-violet-700 border-violet-100',
                    icon: 'bg-violet-100 text-violet-700',
                    ring: 'group-hover:border-violet-200'
                },
                reflect: {
                    badge: 'bg-fuchsia-50 text-fuchsia-700 border-fuchsia-100',
                    icon: 'bg-fuchsia-100 text-fuchsia-700',
                    ring: 'group-hover:border-fuchsia-200'
                }
            };
            return styles[stage] || styles.practice;
        }

        function getLessonActionLabel(status) {
            if (status === 'Completed') return 'Completed';
            if (status === 'In Progress') return 'Resume Lesson';
            return 'Start Lesson';
        }

        function renderSubjectCard(subject, grade) {
            const summary = getSubjectSummary(subject);
            return `
                <article class="subject-card group bg-white rounded-[1.5rem] border border-[#E7E5E4] p-5 min-h-[205px] transition-all duration-300 ease-out hover:-translate-y-1 hover:border-[#7b0323]/20 hover:shadow-xl hover:shadow-black/5 cursor-pointer focus-ring focus:outline-none" role="button" tabindex="0" aria-label="Open ${grade.title} ${subject.name} blocks" data-view="blocks" data-grade-id="${grade.id}" data-subject-id="${subject.id}">
                    <div class="mb-2 flex items-center justify-between gap-3">
                        <span class="truncate text-xs font-semibold text-[#78716C]">${grade.title}</span>
                        <span class="shrink-0 rounded-full border px-2.5 py-0.5 text-[9px] font-semibold uppercase tracking-wide ${getStatusClass(summary.status)}">${summary.status}</span>
                    </div>

                    <h4 class="mb-1 truncate text-[1.35rem] font-bold text-[#1C1917]">${subject.name}</h4>
                    <p class="mb-3 text-sm font-medium text-[#78716C]">${summary.totalBlocks} Blocks • ${summary.totalLessons} Lessons</p>

                    <div class="mb-3.5 flex items-center gap-3">
                        <div class="flex-1">
                            ${renderProgress(subject.progress)}
                        </div>
                        <span class="w-10 text-right text-sm font-semibold text-[#7b0323]">${subject.progress}%</span>
                    </div>

                    <span class="mb-4 inline-flex max-w-full cursor-pointer items-center gap-1.5 rounded-lg text-sm font-semibold focus-ring focus:outline-none" role="link" tabindex="0" aria-label="Open last lesson in ${summary.lastOpened}" data-view="lessons" data-grade-id="${grade.id}" data-subject-id="${subject.id}" data-block-id="${summary.lastBlockId}">
                        <span class="shrink-0 font-medium text-[#A08E8A]">Last:</span>
                        <span class="truncate text-[#7b0323] transition-colors group-hover:text-[#5a0219] group-hover:underline">${summary.lastOpened}</span>
                        <span class="shrink-0 text-[#7b0323] transition-transform duration-300 group-hover:translate-x-0.5" aria-hidden="true">→</span>
                    </span>

                    <div class="flex w-full items-center justify-between rounded-xl bg-[#7b0323] px-4 py-2.5 text-[11px] font-bold uppercase tracking-wide text-white shadow-sm shadow-[#7b0323]/10 transition-all duration-300 group-hover:bg-[#5a0219] group-hover:shadow-lg group-hover:shadow-[#7b0323]/15">
                        <span>View Blocks</span>
                        <svg class="transition-transform duration-300 group-hover:translate-x-0.5 group-hover:-translate-y-0.5" xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><line x1="7" y1="17" x2="17" y2="7"/><polyline points="7 7 17 7 17 17"/></svg>
                    </div>
                </article>
            `;
        }

        function getGradeSummary(grade) {
            const subjects = grade.subjects || [];
            const progress = subjects.length
                ? Math.round(subjects.reduce((sum, subject) => sum + subject.progress, 0) / subjects.length)
                : 0;

            return {
                subjectsCount: subjects.length,
                progress
            };
        }

        function getGradeBadgeLabel(grade) {
            if (grade.id === 'nursery') return 'Nur';
            if (grade.id === 'lkg') return 'LKG';
            if (grade.id === 'ukg') return 'UKG';

            const gradeNumber = grade.id.match(/^grade-(\d+)$/)?.[1];
            return gradeNumber ? `G${gradeNumber}` : grade.title;
        }

        function renderGradeSection(grade) {
            const isExpanded = expandedGradeIds.has(grade.id);
            const isCurrent = grade.id === currentGradeId;
            const summary = getGradeSummary(grade);
            return `
                <section class="space-y-6 rounded-[2rem] p-5 md:p-6" style="background: rgba(123, 3, 35, 0.025);">
                    <button type="button" class="focus-ring flex w-full cursor-pointer items-center justify-between border-b border-[#E7E5E4] pb-4 text-left focus:outline-none" data-view="toggle-grade" data-grade-id="${grade.id}" aria-expanded="${isExpanded}">
                        <div class="flex items-center gap-3">
                            <span class="grid h-12 w-12 shrink-0 place-items-center rounded-2xl bg-[#7b0323] text-sm font-bold text-white shadow-lg shadow-[#7b0323]/20">${getGradeBadgeLabel(grade)}</span>
                            <div class="min-w-0">
                                <div class="flex items-center gap-2">
                                    <h2 class="text-sm font-bold tracking-wide text-[#7b0323] uppercase">${grade.title} Subjects</h2>
                                    ${isCurrent ? '<span class="rounded-full bg-[#f59138]/15 px-2.5 py-1 text-[9px] font-semibold uppercase tracking-wide text-[#7b0323]">Current</span>' : ''}
                                </div>
                                <p class="mt-1 text-sm font-medium normal-case tracking-normal text-[#78716C]">${summary.subjectsCount} subjects • ${summary.progress}% progress</p>
                            </div>
                        </div>
                        <svg class="h-5 w-5 shrink-0 text-[#7b0323] transition-transform duration-300 ${isExpanded ? 'rotate-180' : ''}" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="m6 9 6 6 6-6"/></svg>
                    </button>
                    ${isExpanded ? `
                        <div class="grid grid-cols-1 lg:grid-cols-3 gap-8">
                            ${grade.subjects.map((subject) => renderSubjectCard(subject, grade)).join('')}
                        </div>
                    ` : ''}
                </section>
            `;
        }

        function renderBlocksPage(gradeId, subjectId) {
            const grade = findGrade(gradeId);
            const subject = findSubject(gradeId, subjectId);
            if (!grade || !subject) return renderHome();
            const collapsedCount = subject.blocks.filter((block) => collapsedBlockIds.has(`${grade.id}:${subject.id}:${block.id}`)).length;
            const allBlocksCollapsed = collapsedCount === subject.blocks.length;
            const totalLessons = subject.blocks.reduce((sum, block) => sum + block.lessons.length, 0);
            const completedLessons = subject.blocks.reduce((sum, block) => sum + block.lessons.filter((lesson) => lesson.status === 'Completed').length, 0);
            const completedPercent = totalLessons ? Math.round((completedLessons / totalLessons) * 100) : 0;

            return `
                <section class="space-y-10">
                    <header class="sticky top-24 z-30 -mx-6 border-b border-[#E7E5E4] bg-[#FBF9F7]/95 px-6 py-4 backdrop-blur-xl">
                        <div class="mx-auto grid max-w-[1280px] gap-4 lg:grid-cols-[1fr_auto] lg:items-center">
                            <div class="flex min-w-0 items-center gap-4">
                                <button type="button" class="focus-ring grid h-10 w-10 shrink-0 cursor-pointer place-items-center rounded-xl bg-white text-[#7b0323] shadow-sm ring-1 ring-[#7b0323]/5 transition-all hover:-translate-x-0.5 hover:bg-[#7b0323]/5" data-view="home" aria-label="Back to subjects">
                                    <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="m15 18-6-6 6-6"/></svg>
                                </button>
                                <div class="min-w-0">
                                    <p class="text-[11px] font-semibold uppercase tracking-wide text-[#A08E8A]">Learning journey</p>
                                    <h1 class="truncate text-2xl font-bold text-[#1C1917]">${grade.title} | ${subject.name}</h1>
                                    <p class="mt-1 text-sm font-medium text-[#78716C]">Follow the block sequence from guided inquiry to independent application.</p>
                                </div>
                            </div>
                            <div class="flex flex-col gap-3 sm:flex-row sm:items-center lg:justify-end">
                                <div class="rounded-2xl border border-[#7b0323]/10 bg-white px-4 py-3 shadow-sm shadow-[#7b0323]/5">
                                    <p class="text-[11px] font-semibold uppercase tracking-wide text-[#A08E8A]">Progress summary</p>
                                    <p class="mt-1 text-sm font-bold text-[#1C1917]">${subject.blocks.length} Blocks • ${totalLessons} Lessons • ${completedPercent}% Completed</p>
                                    <div class="mt-2">${renderProgress(completedPercent, 'var(--amber-orange)')}</div>
                                </div>
                                <button type="button" class="focus-ring cursor-pointer rounded-full border border-[#7b0323]/10 bg-white/70 px-4 py-2 text-[11px] font-bold uppercase tracking-wide text-[#7b0323] transition-all hover:bg-[#7b0323]/5 focus:outline-none" data-view="toggle-all-blocks" data-grade-id="${grade.id}" data-subject-id="${subject.id}">
                                    ${allBlocksCollapsed ? 'Expand all' : 'Collapse all'}
                                </button>
                            </div>
                        </div>
                    </header>
                    ${subject.blocks.length ? subject.blocks.map((block, index) => renderBlockSection(block, index, grade, subject)).join('') : renderEmptyState('No blocks available yet.')}
                </section>
            `;
        }

        function getLessonDisplayStatus(lesson) {
            return lesson.status;
        }

        function getLessonStatusClass(status) {
            if (status === 'Completed') return 'bg-[#7b0323]/5 text-[#7b0323]';
            if (status === 'In Progress') return 'bg-[#f59138]/15 text-[#7b0323]';
            return 'bg-[#F5F5F4] text-[#78716C]';
        }

        function renderStatusMark(status) {
            if (status === 'Completed') {
                return '<svg xmlns="http://www.w3.org/2000/svg" width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"/></svg>';
            }
            return '';
        }

        function renderEmptyState(message) {
            return `
                <div class="rounded-[2rem] border border-dashed border-[#7b0323]/20 bg-white/70 p-8 text-center shadow-sm">
                    <p class="text-sm font-semibold text-[#78716C]">${message}</p>
                </div>
            `;
        }

        function renderBlockSection(block, blockIndex, grade, subject) {
            const blockKey = `${grade.id}:${subject.id}:${block.id}`;
            const isExpanded = !collapsedBlockIds.has(blockKey);
            const currentLesson = block.lessons.find((lesson) => lesson.status === 'In Progress');
            return `
                <section class="rounded-[2rem] border border-white bg-gradient-to-br from-[#fffdf9] via-white to-[#7b0323]/[0.025] p-4 shadow-[0_20px_60px_rgba(28,25,23,0.06)] ring-1 ring-[#7b0323]/5 transition-all duration-300 md:p-6">
                    <button type="button" class="focus-ring relative flex w-full cursor-pointer flex-col gap-4 pr-12 text-left focus:outline-none sm:flex-row sm:items-center sm:justify-between sm:pr-14" data-view="toggle-block" data-block-key="${blockKey}" aria-expanded="${isExpanded}">
                        <div class="flex min-w-0 items-center gap-4">
                            <span class="grid h-12 w-12 shrink-0 place-items-center rounded-2xl bg-[#7b0323] text-sm font-bold text-white shadow-lg shadow-[#7b0323]/20">${String(blockIndex + 1).padStart(2, '0')}</span>
                            <div class="min-w-0">
                                <p class="text-[11px] font-semibold uppercase tracking-wide text-[#A08E8A]">Block ${blockIndex + 1}</p>
                                <h2 class="truncate text-xl font-bold text-[#1C1917]">${block.title}</h2>
                                <div class="mt-2 flex flex-wrap items-center gap-2 text-sm font-medium text-[#78716C]">
                                    <span>${block.lessons.length} lessons</span>
                                    <span class="h-1 w-1 rounded-full bg-[#D6D3D1]" aria-hidden="true"></span>
                                    <span class="font-semibold text-[#7b0323]">${block.progress}% complete</span>
                                </div>
                            </div>
                        </div>
                        <div class="w-full sm:w-56">
                            ${renderProgress(block.progress)}
                        </div>
                        <span class="absolute right-0 top-1/2 grid h-10 w-10 -translate-y-1/2 place-items-center rounded-full border border-[#7b0323]/10 bg-white text-[#7b0323] shadow-md shadow-[#7b0323]/10 transition-all duration-300 hover:border-[#7b0323]/25 hover:bg-[#7b0323]/5" aria-hidden="true">
                            <svg class="h-5 w-5 transition-transform duration-300 ${isExpanded ? 'rotate-180' : ''}" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="m6 9 6 6 6-6"/></svg>
                        </span>
                    </button>
                    ${isExpanded ? `
                        <div class="mt-6 grid grid-cols-1 gap-4 md:grid-cols-2 xl:grid-cols-3">
                            ${block.lessons.length ? block.lessons.map((lesson, lessonIndex) => renderLessonCard(lesson, lessonIndex, block, grade, subject, currentLesson?.id === lesson.id)).join('') : renderEmptyState('No lessons available for this block yet.')}
                        </div>
                    ` : ''}
                </section>
            `;
        }

        function renderLessonCard(lesson, lessonIndex, block, grade, subject, isCurrent) {
            const displayStatus = getLessonDisplayStatus(lesson);
            const stageStyle = getStageStyle(lesson.stage);
            const actionLabel = getLessonActionLabel(displayStatus);
            const statusTone = displayStatus === 'Completed'
                ? 'bg-emerald-50 text-emerald-700 border-emerald-100'
                : displayStatus === 'In Progress'
                    ? 'bg-[#7b0323]/5 text-[#7b0323] border-[#7b0323]/15'
                    : 'bg-[#F5F5F4] text-[#78716C] border-[#E7E5E4]';
            return `
                <article class="focus-ring group relative flex min-h-[218px] cursor-pointer flex-col rounded-[1.5rem] border ${isCurrent ? 'border-[#7b0323]/45 shadow-[0_22px_60px_rgba(123,3,35,0.16)] ring-4 ring-[#7b0323]/5' : `border-[#E7E5E4] shadow-sm shadow-black/[0.025] ${stageStyle.ring}`} bg-white p-4 transition-all duration-300 hover:-translate-y-1 hover:shadow-xl hover:shadow-black/5" role="button" tabindex="0" aria-label="Open ${lesson.title}" data-view="lessons" data-grade-id="${grade.id}" data-subject-id="${subject.id}" data-block-id="${block.id}">
                    ${lessonIndex < block.lessons.length - 1 && lessonIndex % 3 !== 2 ? '<span class="pointer-events-none absolute -right-3 top-1/2 z-10 hidden h-6 w-6 -translate-y-1/2 place-items-center rounded-full border border-[#7b0323]/10 bg-white text-[#A08E8A] shadow-sm xl:grid" aria-hidden="true">→</span>' : ''}
                    <div class="mb-4 flex items-start justify-between gap-3">
                        <span class="inline-flex items-center gap-2 rounded-full border px-3 py-1 text-[10px] font-semibold uppercase tracking-wide ${stageStyle.badge}">
                            <i data-lucide="${lesson.icon}" class="h-3.5 w-3.5"></i>
                            ${lesson.title}
                        </span>
                        <span class="rounded-full border px-2.5 py-1 text-[10px] font-semibold uppercase tracking-wide ${statusTone}">
                            ${displayStatus}
                        </span>
                    </div>
                    <div class="flex flex-1 flex-col">
                        <div class="mb-3 flex items-center gap-3">
                            <span class="grid h-10 w-10 shrink-0 place-items-center rounded-2xl ${stageStyle.icon}">
                                <i data-lucide="${lesson.icon}" class="h-5 w-5"></i>
                            </span>
                            <div class="min-w-0">
                                <p class="text-[11px] font-semibold uppercase tracking-wide text-[#A08E8A]">Step ${lessonIndex + 1}</p>
                                <h3 class="truncate text-lg font-bold text-[#1C1917]">${lesson.title}</h3>
                            </div>
                        </div>
                        <p class="line-clamp-2 text-sm font-medium leading-6 text-[#6D5D5A]">${lesson.description}</p>
                        <div class="mt-auto pt-5">
                            <div class="mb-4 flex items-center justify-between gap-3">
                                <span class="inline-flex items-center gap-1.5 text-xs font-semibold text-[#A08E8A]">
                                    <i data-lucide="clock-3" class="h-3.5 w-3.5"></i>
                                    ${lesson.duration}
                                </span>
                                <span class="text-xs font-semibold text-[#7b0323]">${lesson.progress}%</span>
                            </div>
                            ${renderProgress(lesson.progress, isCurrent ? 'var(--wine-red)' : 'var(--amber-orange)')}
                            <span class="mt-4 flex w-full items-center justify-center rounded-2xl px-4 py-3 text-[11px] font-bold uppercase tracking-wide transition-all ${isCurrent ? 'bg-[#7b0323] text-white shadow-lg shadow-[#7b0323]/20' : displayStatus === 'Completed' ? 'bg-emerald-50 text-emerald-700' : 'bg-[#7b0323]/5 text-[#7b0323] group-hover:bg-[#7b0323] group-hover:text-white'}">
                                ${actionLabel}
                            </span>
                        </div>
                    </div>
                </article>
            `;
        }

        function renderLessonsPage(gradeId, subjectId, blockId) {
            const grade = findGrade(gradeId);
            const subject = findSubject(gradeId, subjectId);
            const block = findBlock(gradeId, subjectId, blockId);
            if (!grade || !subject || !block) return renderHome();

            return `
                <section class="space-y-8">
                    <button type="button" class="focus-ring inline-flex cursor-pointer items-center gap-2 rounded-2xl border border-[#E7E5E4] bg-white px-5 py-3 text-[11px] font-bold uppercase tracking-wide text-[#7b0323] transition-all hover:border-[#7b0323]/30 hover:bg-[#7b0323]/5 focus:outline-none" data-view="blocks" data-grade-id="${grade.id}" data-subject-id="${subject.id}">
                        <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="m15 18-6-6 6-6"/></svg>
                        <span>Back to Blocks</span>
                    </button>
                    <header class="rounded-[2.5rem] border border-[#E7E5E4] bg-white p-8 md:p-10">
                        <span class="text-[10px] font-semibold text-[#78716C] tracking-wide uppercase">${grade.title} / ${subject.name}</span>
                        <h1 class="mt-2 text-4xl font-bold text-[#1C1917]">${block.title}</h1>
                        <div class="mt-5 flex flex-wrap items-center gap-3">
                            <span class="rounded-full border px-3 py-1 text-[10px] font-semibold uppercase tracking-wide ${getStatusClass(block.status)}">${block.status}</span>
                            <span class="text-sm font-bold text-[#7b0323]">${block.progress}% Progress</span>
                            <span class="text-sm font-semibold text-[#78716C]">${block.lessons.length} Lessons</span>
                        </div>
                    </header>
                    <div class="space-y-4">
                        ${block.lessons.map((lesson, index) => renderLessonRow(lesson, index)).join('')}
                    </div>
                </section>
            `;
        }

        function renderLessonRow(lesson, index) {
            const actionLabel = lesson.status === 'Completed' ? 'Review' : lesson.status === 'In Progress' ? 'Continue' : 'Start';
            return `
                <article class="grid gap-5 rounded-[2rem] border border-[#E7E5E4] bg-white p-5 transition-all hover:shadow-xl hover:shadow-black/5 md:grid-cols-[auto_1fr_auto] md:items-center md:p-6">
                    <div class="grid h-12 w-12 place-items-center rounded-2xl bg-[#7b0323]/5 text-sm font-bold text-[#7b0323]">${index + 1}</div>
                    <div>
                        <div class="flex flex-wrap items-center gap-3">
                            <h2 class="text-xl font-semibold text-[#1C1917]">${lesson.title}</h2>
                            <span class="rounded-full border px-3 py-1 text-[10px] font-semibold uppercase tracking-wide ${getStatusClass(lesson.status)}">${lesson.status}</span>
                        </div>
                        <div class="mt-3 grid gap-3 md:grid-cols-[1fr_auto] md:items-center">
                            ${renderProgress(lesson.progress)}
                            <span class="text-sm font-bold text-[#78716C]">${lesson.duration}</span>
                        </div>
                    </div>
                    <button type="button" class="focus-ring cursor-pointer rounded-2xl bg-[#7b0323] px-6 py-4 text-[11px] font-bold uppercase tracking-wide text-white transition-all hover:bg-[#5a0219] focus:outline-none">${actionLabel}</button>
                </article>
            `;
        }

        function renderHome() {
            const allExpanded = expandedGradeIds.size === curriculumByGrade.length;
            return `
                <div class="mb-8 flex items-center justify-between gap-4">
                     <p class="text-lg font-bold tracking-wide text-[#78716C] uppercase">Grades</p>
                    <button type="button" class="focus-ring cursor-pointer text-[11px] font-bold uppercase tracking-wide text-[#7b0323] transition-colors hover:text-[#5a0219] focus:outline-none" data-view="toggle-all">
                        ${allExpanded ? 'Collapse all' : 'Expand all'}
                    </button>
                </div>
                <div class="space-y-12">
                    ${curriculumByGrade.map(renderGradeSection).join('')}
                </div>
            `;
        }

        function renderRoute() {
            const outlet = document.getElementById('curriculum-sections');
            const heroSection = document.querySelector('.today-fade-in');
            const hash = window.location.hash.replace(/^#/, '');
            const params = new URLSearchParams(hash);
            const view = params.get('view') || 'home';

            if (view === 'blocks') {
                heroSection.classList.add('hidden');
                outlet.innerHTML = renderBlocksPage(params.get('grade'), params.get('subject'));
            } else if (view === 'lessons') {
                heroSection.classList.add('hidden');
                outlet.innerHTML = renderLessonsPage(params.get('grade'), params.get('subject'), params.get('block'));
            } else {
                heroSection.classList.remove('hidden');
                outlet.innerHTML = renderHome();
            }
        }

        document.addEventListener('click', (event) => {
            const target = event.target.closest('[data-view]');
            if (!target) return;

            if (target.dataset.view === 'toggle-all') {
                if (expandedGradeIds.size === curriculumByGrade.length) {
                    expandedGradeIds.clear();
                    expandedGradeIds.add(currentGradeId);
                } else {
                    curriculumByGrade.forEach((grade) => expandedGradeIds.add(grade.id));
                }
                renderRoute();
                return;
            }

            if (target.dataset.view === 'toggle-grade') {
                const gradeId = target.dataset.gradeId;
                if (expandedGradeIds.has(gradeId)) {
                    expandedGradeIds.delete(gradeId);
                } else {
                    expandedGradeIds.add(gradeId);
                }
                renderRoute();
                return;
            }

            if (target.dataset.view === 'toggle-block') {
                const blockKey = target.dataset.blockKey;
                if (collapsedBlockIds.has(blockKey)) {
                    collapsedBlockIds.delete(blockKey);
                } else {
                    collapsedBlockIds.add(blockKey);
                }
                renderRoute();
                return;
            }

            if (target.dataset.view === 'toggle-all-blocks') {
                const grade = findGrade(target.dataset.gradeId);
                const subject = findSubject(target.dataset.gradeId, target.dataset.subjectId);
                if (!grade || !subject) return;

                const keys = subject.blocks.map((block) => `${grade.id}:${subject.id}:${block.id}`);
                const allCollapsed = keys.every((key) => collapsedBlockIds.has(key));
                if (allCollapsed) {
                    keys.forEach((key) => collapsedBlockIds.delete(key));
                } else {
                    keys.forEach((key) => collapsedBlockIds.add(key));
                }
                renderRoute();
                return;
            }

            if (target.dataset.view === 'home') {
                window.location.hash = '';
                return;
            }

            if (target.dataset.view === 'blocks') {
                window.location.hash = `view=blocks&grade=${target.dataset.gradeId}&subject=${target.dataset.subjectId}`;
                return;
            }

            if (target.dataset.view === 'lessons') {
                window.location.hash = `view=lessons&grade=${target.dataset.gradeId}&subject=${target.dataset.subjectId}&block=${target.dataset.blockId}`;
            }
        });

        document.addEventListener('keydown', (event) => {
            if (event.key !== 'Enter' && event.key !== ' ') return;
            const target = event.target.closest('[data-view]');
            if (!target) return;
            event.preventDefault();
            target.click();
        });

        const menuToggle = document.getElementById('menuToggle');
        const mobileMenu = document.getElementById('mobileMenu');

        menuToggle?.addEventListener('click', () => {
            const isExpanded = menuToggle.getAttribute('aria-expanded') === 'true';
            menuToggle.setAttribute('aria-expanded', String(!isExpanded));
            mobileMenu?.classList.toggle('hidden', isExpanded);
        });

        window.addEventListener('hashchange', renderRoute);
        renderRoute();
        lucide.createIcons();
    </script>
</body>
</html>
