<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>XSEED Academic Dashboard</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=Poppins:wght@500;600;700&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        :root {
            --wine-red: #A41034;
            --amber-orange: #F49138;
        }
        body {
            font-family: 'Inter', sans-serif;
            background-color: #FBF9F7;
            color: #1C1917;
            overflow-x: hidden;
        }
        .bg-wine { background-color: var(--wine-red); }
        .text-wine { color: var(--wine-red); }
        .border-wine-5 { border-color: rgba(123, 3, 35, 0.05); }
        .bg-amber-light { background-color: rgba(244, 145, 56, 0.05); }
        .nav-button.active {
            background-color: white;
            color: var(--wine-red);
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
        }
        .focus-ring:focus-visible {
            outline: 3px solid rgba(244, 145, 56, 0.45);
            outline-offset: 3px;
        }
        .glass {
            background: rgba(255, 255, 255, 0.8);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
        }
        .orb {
            position: fixed;
            filter: blur(120px);
            z-index: -1;
            opacity: 0.04;
            pointer-events: none;
        }
        .pill-nav-shadow {
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.03);
        }
        .profile-menu {
            opacity: 1;
            pointer-events: auto;
            transform: translateY(0);
        }
        .profile-menu.hidden {
            display: block;
            opacity: 0;
            pointer-events: none;
            transform: translateY(-6px);
        }
        .profile-menu-item:hover {
            background-color: #F8F5F2;
        }
        .profile-menu-item.sign-out:hover {
            background-color: #FDF0F2;
        }
        /* Cinematic overlay for full-card images */
        .hero-gradient-overlay {
            background: linear-gradient(75deg, rgb(0 0 0 / 0.78) 0%, rgb(0 0 0 / 0.54) 42%, rgb(0 0 0 / 0) 100%);
        }
        .card-shadow {
            box-shadow: 0 30px 60px -12px rgba(28, 25, 23, 0.15);
        }
        @keyframes fade-in {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .today-fade-in {
            animation: fade-in 0.8s ease-out forwards;
        }
        .subject-card:hover {
            border-color: rgba(123, 3, 35, 0.2);
        }
        .tab-panel[data-tab-panel="Communication"],
        .tab-panel[data-tab-panel="Learnometer"],
        .tab-panel[data-tab-panel="Practice Gym"] {
            font-family: 'Inter', sans-serif;
            letter-spacing: 0;
        }
        .tab-panel[data-tab-panel="Communication"] .font-black,
        .tab-panel[data-tab-panel="Learnometer"] .font-black,
        .tab-panel[data-tab-panel="Practice Gym"] .font-black {
            font-weight: 700 !important;
        }
        .tab-panel[data-tab-panel="Communication"] .tracking-tight,
        .tab-panel[data-tab-panel="Communication"] .tracking-wider,
        .tab-panel[data-tab-panel="Communication"] .tracking-widest,
        .tab-panel[data-tab-panel="Learnometer"] .tracking-tight,
        .tab-panel[data-tab-panel="Learnometer"] .tracking-wider,
        .tab-panel[data-tab-panel="Learnometer"] .tracking-widest,
        .tab-panel[data-tab-panel="Practice Gym"] .tracking-tight,
        .tab-panel[data-tab-panel="Practice Gym"] .tracking-wider,
        .tab-panel[data-tab-panel="Practice Gym"] .tracking-widest {
            letter-spacing: 0 !important;
        }
        .tab-panel[data-tab-panel="Communication"] h1,
        .tab-panel[data-tab-panel="Communication"] h2,
        .tab-panel[data-tab-panel="Learnometer"] h1,
        .tab-panel[data-tab-panel="Learnometer"] h2,
        .tab-panel[data-tab-panel="Practice Gym"] h1,
        .tab-panel[data-tab-panel="Practice Gym"] h2 {
            font-weight: 700;
            letter-spacing: 0;
        }
        .communication-title {
            font-family: 'Poppins', sans-serif;
            font-size: 24px;
            font-weight: 600 !important;
            letter-spacing: -0.3px !important;
        }
        .communication-card-title {
            font-family: 'Inter', sans-serif;
            font-size: 16px;
            font-weight: 600 !important;
            letter-spacing: 0;
        }
        .communication-meta {
            color: #8B8B8B;
            font-size: 12px;
            font-weight: 500 !important;
            letter-spacing: 0.2px !important;
        }
        .communication-content-text {
            color: #2C2C2C;
            font-size: 14px;
            font-weight: 400;
            line-height: 1.7;
            margin-bottom: 12px;
        }
        .communication-content-text:last-child {
            margin-bottom: 0;
        }
        .communication-action {
            font-size: 13px;
            font-weight: 600 !important;
            letter-spacing: 0.3px !important;
        }
        .communication-avatar {
            font-size: 13px;
            font-weight: 600 !important;
            letter-spacing: 0;
        }
        @media (prefers-reduced-motion: reduce) {
            *,
            *::before,
            *::after {
                animation-duration: 0.01ms !important;
                animation-iteration-count: 1 !important;
                scroll-behavior: auto !important;
                transition-duration: 0.01ms !important;
            }
        }
    </style>
</head>
<body class="overflow-x-hidden antialiased selection:bg-[#A41034]/10">

    <!-- Decorative Blur Orbs -->
    <div class="orb top-[-10%] right-[-5%] w-[400px] h-[400px] bg-[#f59138]"></div>
    <div class="orb bottom-[-5%] left-[-5%] w-[300px] h-[300px] bg-[#A41034]"></div>

    <!-- Header -->
    <header class="sticky top-0 z-50 w-full border-b border-wine-5 bg-white px-6 backdrop-blur-xl md:px-12">
        <div class="max-w-[1600px] mx-auto h-24 flex items-center justify-between">
            <!-- Logo & Branding -->
            <a href="#" class="focus-ring flex items-center" aria-label="SuperTeacher Edge home">
                <img src="assets/st-edge-logo4.png" alt="SuperTeacher Edge" class="h-14 w-auto object-contain">
            </a>

            <!-- Navigation -->
            <nav class="hidden lg:flex items-center bg-amber-light p-1.5 rounded-[2rem] border border-wine-5" aria-label="Primary navigation">
                <button type="button" class="nav-button active focus-ring flex items-center gap-2 px-6 py-3 rounded-full transition-all duration-300 text-xs font-semibold  tracking-wide" data-nav-title="Teacher Lesson Plan" aria-current="page">
                    <!-- <i data-lucide="graduation-cap" class="w-4 h-4"></i> -->
                    <span>Teacher Lesson Plan</span>
                </button>
                <button type="button" class="nav-button focus-ring flex items-center gap-2 px-6 py-3 rounded-full transition-all duration-300 text-xs font-semibold  tracking-wide text-[#6D5D5A] hover:text-wine" data-nav-title="Parent Lesson Plan">
                    <!-- <i data-lucide="home" class="w-4 h-4"></i> -->
                    <span>Parent Lesson Plan</span>
                </button>
                <button type="button" class="nav-button focus-ring flex items-center gap-2 px-6 py-3 rounded-full transition-all duration-300 text-xs font-semibold  tracking-wide text-[#6D5D5A] hover:text-wine" data-nav-title="Communication">
                    <!-- <i data-lucide="message-square" class="w-4 h-4"></i> -->
                    <span>Communication</span>
                </button>
                <button type="button" class="nav-button focus-ring flex items-center gap-2 px-6 py-3 rounded-full transition-all duration-300 text-xs font-semibold  tracking-wide text-[#6D5D5A] hover:text-wine" data-nav-title="Learnometer">
                    <!-- <i data-lucide="line-chart" class="w-4 h-4"></i> -->
                    <span>Learnometer</span>
                </button>
                <button type="button" class="nav-button focus-ring flex items-center gap-2 px-6 py-3 rounded-full transition-all duration-300 text-xs font-semibold  tracking-wide text-[#6D5D5A] hover:text-wine" data-nav-title="Practice Gym">
                    <!-- <i data-lucide="dumbbell" class="w-4 h-4"></i> -->
                    <span>Practice Gym</span>
                </button>
            </nav>

            <!-- Actions -->
            <div class="flex items-center gap-6">
                <button type="button" class="focus-ring hidden p-3 text-wine bg-[#A41034]/5 rounded-2xl transition-all hover:bg-[#A41034]/10 md:block" aria-label="Open notifications">
                    <i data-lucide="bell" class="w-5 h-5"></i>
                </button>
                <div class="relative shrink-0">
                    <button type="button" id="profileToggle" class="focus-ring flex h-10 w-10 items-center justify-center rounded-full bg-wine text-sm font-bold tracking-wide text-white shadow-[0_2px_8px_rgba(164,16,52,0.25)] transition-all hover:shadow-[0_4px_16px_rgba(164,16,52,0.35)]" aria-label="Open profile menu" aria-expanded="false">
                        RS
                    </button>
                    <div id="profileMenu" class="profile-menu hidden absolute right-0 top-[calc(100%+10px)] z-[200] min-w-[210px] rounded-[14px] bg-white p-1.5 shadow-[0_8px_32px_rgba(26,18,16,0.12),0_1px_4px_rgba(26,18,16,0.06)] transition-all duration-200">
                        <div class="border-b border-[#f0ebe6] px-3.5 pb-3 pt-2.5">
                            <div class="text-sm font-bold text-[#1a1210]">Ravi Sharma</div>
                            <div class="mt-0.5 text-xs text-[#8a7968]">Teacher</div>
                        </div>
                        <div class="py-1.5">
                            <button type="button" class="profile-menu-item w-full rounded-lg px-3.5 py-2.5 text-left text-sm font-medium text-[#1a1210] transition-colors">Profile</button>
                            <button type="button" class="profile-menu-item w-full rounded-lg px-3.5 py-2.5 text-left text-sm font-medium text-[#1a1210] transition-colors">Front Office</button>
                            <button type="button" class="profile-menu-item w-full rounded-lg px-3.5 py-2.5 text-left text-sm font-medium text-[#1a1210] transition-colors">Content Generation System</button>
                        </div>
                        <div class="border-t border-[#f0ebe6] pb-0.5 pt-1.5">
                            <button type="button" class="profile-menu-item sign-out w-full rounded-lg px-3.5 py-2.5 text-left text-sm font-medium text-wine transition-colors">Sign Out</button>
                        </div>
                    </div>
                </div>
                <button type="button" class="focus-ring lg:hidden p-2 text-wine" id="menuToggle" aria-label="Open navigation menu" aria-expanded="false">
                    <i data-lucide="menu" class="w-7 h-7"></i>
                </button>
            </div>
        </div>
        <nav id="mobileMenu" class="hidden border-t border-wine-5 pb-5 lg:hidden" aria-label="Mobile navigation">
            <div class="grid gap-2 rounded-[1.5rem] bg-amber-light p-2">
                <button type="button" class="nav-button active focus-ring flex items-center gap-3 rounded-2xl px-4 py-3 text-left text-xs font-semibold  tracking-wide" data-nav-title="Teacher Lesson Plan" aria-current="page">
                    <i data-lucide="graduation-cap" class="h-4 w-4"></i>
                    <span>Teacher Lesson Plan</span>
                </button>
                <button type="button" class="nav-button focus-ring flex items-center gap-3 rounded-2xl px-4 py-3 text-left text-xs font-semibold  tracking-wide text-[#6D5D5A] hover:bg-white hover:text-wine" data-nav-title="Parent Lesson Plan">
                    <i data-lucide="home" class="h-4 w-4"></i>
                    <span>Parent Lesson Plan</span>
                </button>
                <button type="button" class="nav-button focus-ring flex items-center gap-3 rounded-2xl px-4 py-3 text-left text-xs font-semibold  tracking-wide text-[#6D5D5A] hover:bg-white hover:text-wine" data-nav-title="Communication">
                    <i data-lucide="message-square" class="h-4 w-4"></i>
                    <span>Communication</span>
                </button>
                <button type="button" class="nav-button focus-ring flex items-center gap-3 rounded-2xl px-4 py-3 text-left text-xs font-semibold  tracking-wide text-[#6D5D5A] hover:bg-white hover:text-wine" data-nav-title="Learnometer">
                    <i data-lucide="line-chart" class="h-4 w-4"></i>
                    <span>Learnometer</span>
                </button>
                <button type="button" class="nav-button focus-ring flex items-center gap-3 rounded-2xl px-4 py-3 text-left text-xs font-semibold  tracking-wide text-[#6D5D5A] hover:bg-white hover:text-wine" data-nav-title="Practice Gym">
                    <i data-lucide="dumbbell" class="h-4 w-4"></i>
                    <span>Practice Gym</span>
                </button>
            </div>
        </nav>
    </header>

    <main class="tab-panel max-w-[1280px] mx-auto px-6 py-8" data-tab-panel="Teacher Lesson Plan">
        
        <!-- Updated Continue Lesson Section -->
        <section class="mb-10 today-fade-in">

            <section class="relative rounded-[3rem] overflow-hidden card-shadow group h-[420px]">
                <!-- Background Image Covering Entire Card with Top Alignment -->
                <img
                    src="assets/light-shadow.jpeg"
                    class="absolute inset-0 w-full h-full object-cover object-top transition-transform duration-1000 group-hover:scale-105"
                    alt="Light and Shadows"
                />
                
                <!-- Dark Gradient Overlay for Readability -->
                <div class="absolute inset-0 hero-gradient-overlay"></div>

                <!-- Content Layer -->
                <div class="absolute inset-0 p-8 md:p-12 flex flex-col justify-end">
                    
                    <div class="flex flex-col md:flex-row md:items-end justify-between gap-6">
                        <div class="max-w-2xl">
                            <span class="inline-flex items-center gap-2 px-4 py-1.5 bg-[var(--amber-orange)] text-white rounded-full text-[10px] font-bold  tracking-wide shadow-xl mb-6">
                                <i data-lucide="play-circle" class="w-3.5 h-3.5"></i>
                                Science. Grade 4 - Block 01
                            </span>
                            <h1 class="text-4xl md:text-5xl font-extrabold text-white mb-4 leading-tight">
                                Light and <br/>Shadows
                            </h1>
                            <div class="max-w-2xl space-y-2 text-white/85">
                                <p class="text-base md:text-lg font-semibold">
                                    Changes in the Sky Across the Day
                                </p>
                                <p class="max-w-xl text-sm md:text-base font-medium leading-6 text-white/75">
                                    Explain why the Sun appears to move in the sky and how it affects the length and rhythm of a day.
                                </p>
                            </div>
                        </div>

                        <!-- Action Row -->
                        <div class="flex flex-col items-end gap-5">
                            <div class="flex items-center gap-4 bg-black/40 backdrop-blur-md px-5 py-3 rounded-2xl border border-white/10">
                                <div class="h-1.5 w-24 bg-white/20 rounded-full overflow-hidden" role="progressbar" aria-valuenow="45" aria-valuemin="0" aria-valuemax="100" aria-label="Lesson progress 45% complete">
                                    <div class="h-full bg-[#f59138] rounded-full shadow-[0_0_10px_#f59138]" style="width: 45%"></div>
                                </div>
                                <span class="text-[10px] font-bold text-white tracking-wide ">45% Progress</span>
                            </div>

                            <button
                                type="button"
                                class="focus-ring bg-white text-[#1C1917] px-10 py-5 rounded-2xl font-bold flex items-center gap-3 transition-all shadow-2xl hover:bg-[#f59138] hover:text-white hover:-translate-y-1 active:scale-95"
                            >
                                Continue Lesson
                                <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="currentColor"><polygon points="5 3 19 12 5 21 5 3"/></svg>
                            </button>
                        </div>
                    </div>
                </div>
            </section>
        </section>

        <!-- JSON-driven Curriculum Sections -->
        <section id="curriculum-sections" class="space-y-16"></section>
    </main>

    <main class="tab-panel hidden max-w-[1280px] mx-auto px-6 py-6" data-tab-panel="Communication">
        <section class="mx-auto mb-6 flex max-w-[70%] flex-col gap-4 max-lg:max-w-4xl max-sm:max-w-none md:flex-row md:items-center md:justify-between">
            <h1 class="communication-title truncate text-[#1C1917]">Communication</h1>
            <div class="flex flex-wrap items-center gap-3">
                <button type="button" class="communication-action focus-ring flex items-center gap-2.5 rounded-2xl border border-[#E7E5E4] bg-white px-5 py-3  text-[#1C1917] transition-all hover:border-[#A41034]/20 active:scale-95">
                    <i data-lucide="users" class="h-4 w-4"></i>
                    Manage Groups
                </button>
                <button type="button" class="communication-action focus-ring flex items-center gap-2.5 rounded-2xl bg-[#A41034] px-5 py-3  text-white transition-all hover:bg-[#7a0c26] active:scale-95">
                    <i data-lucide="plus" class="h-4 w-4"></i>
                    New Announcement
                </button>
            </div>
        </section>  

        <aside id="communicationFilterToolbar" class="fixed bottom-20 left-4 right-4 z-40 hidden lg:bottom-auto lg:left-auto lg:right-4 lg:top-[calc(50%+1rem)] lg:-translate-y-1/2" aria-label="Filter announcements by grade"></aside>

        <section id="communicationFeed" class="mx-auto grid max-w-[70%] gap-6 max-lg:max-w-4xl max-sm:max-w-none"></section>
    </main>

    <main class="tab-panel hidden max-w-[1280px] mx-auto px-6" data-tab-panel="Learnometer" id="learnometerPanel"></main>

    <main class="tab-panel hidden gym max-w-[1280px] mx-auto px-6 py-6" data-tab-panel="Practice Gym">
        <section class="mx-auto mb-5 flex max-w-[70%] flex-col gap-4 max-lg:max-w-4xl max-sm:max-w-none md:flex-row md:items-end md:justify-between">
            <div>
                <h1 class="truncate font-['Poppins'] text-[26px] font-semibold leading-8 text-[#1C1917] tracking-[-0.3px]">Practice Gym</h1>
            </div>
            <div class="inline-flex w-fit items-center gap-1 rounded-xl border border-[#E5E5E5] bg-[#F6F6F6] p-1">
                <button type="button" class="h-9 rounded-lg bg-white px-5 text-[13px] font-semibold text-[#A41034] shadow-[0_4px_14px_rgba(28,25,23,0.08)]">Teacher</button>
                <button type="button" class="h-9 rounded-lg px-5 text-[13px] font-semibold text-[#78716C] transition hover:text-[#1C1917]">Parent</button>
            </div>
        </section>

        <section class="mx-auto max-w-[70%] rounded-2xl border border-[#E7E5E4] bg-white p-7 shadow-[0_18px_45px_rgba(28,25,23,0.07)] max-lg:max-w-4xl max-sm:max-w-none">
            <div class="grid grid-cols-1 gap-5 md:grid-cols-3">
                <label class="block">
                    <span class="mb-2 block text-xs font-medium leading-5 text-[#8B8B8B]">Grade</span>
                    <span class="flex h-11 items-center gap-3 rounded-[10px] border border-[#E5E5E5] bg-[#FAFAFA] px-3 transition-all focus-within:border-[#A41034] focus-within:shadow-[0_0_0_3px_rgba(164,16,52,0.10)]">
                        <i data-lucide="graduation-cap" class="h-4 w-4 shrink-0 text-[#A41034]"></i>
                        <select class="w-full cursor-pointer bg-transparent text-sm font-medium text-[#1C1917] outline-none">
                            <option>Grade 4</option><option>Grade 1</option><option>Grade 2</option><option>Grade 3</option><option>Grade 5</option><option>Grade 6</option><option>Grade 7</option><option>Grade 8</option>
                        </select>
                    </span>
                </label>
                <label class="block">
                    <span class="mb-2 block text-xs font-medium leading-5 text-[#8B8B8B]">Subject</span>
                    <span class="flex h-11 items-center gap-3 rounded-[10px] border border-[#E5E5E5] bg-[#FAFAFA] px-3 transition-all focus-within:border-[#A41034] focus-within:shadow-[0_0_0_3px_rgba(164,16,52,0.10)]">
                        <i data-lucide="book-open" class="h-4 w-4 shrink-0 text-[#A41034]"></i>
                        <select class="w-full cursor-pointer bg-transparent text-sm font-medium text-[#1C1917] outline-none">
                            <option>Science</option><option>English</option><option>Mathematics</option>
                        </select>
                    </span>
                </label>
                <label class="block">
                    <span class="mb-2 block text-xs font-medium leading-5 text-[#8B8B8B]">Block</span>
                    <span class="flex h-11 items-center gap-3 rounded-[10px] border border-[#E5E5E5] bg-[#FAFAFA] px-3 transition-all focus-within:border-[#A41034] focus-within:shadow-[0_0_0_3px_rgba(164,16,52,0.10)]">
                        <i data-lucide="layers" class="h-4 w-4 shrink-0 text-[#A41034]"></i>
                        <select class="w-full cursor-pointer bg-transparent text-sm font-medium text-[#1C1917] outline-none">
                            <option>Block 01: Light and Shadows</option><option>Block 02: Force and Motion</option><option>Block 03: Electricity Basics</option><option>Block 04: The Solar System</option>
                        </select>
                    </span>
                </label>
            </div>

            <div class="mt-5 grid grid-cols-1 gap-5 md:grid-cols-2">
                <label class="block">
                    <span class="mb-2 block text-xs font-medium leading-5 text-[#8B8B8B]">Difficulty</span>
                    <span class="flex h-11 items-center gap-3 rounded-[10px] border border-[#E5E5E5] bg-[#FAFAFA] px-3 transition-all focus-within:border-[#A41034] focus-within:shadow-[0_0_0_3px_rgba(164,16,52,0.10)]">
                        <i data-lucide="gauge" class="h-4 w-4 shrink-0 text-[#A41034]"></i>
                        <select class="w-full cursor-pointer bg-transparent text-sm font-medium text-[#1C1917] outline-none">
                            <option>Medium</option><option>Easy</option><option>Hard</option>
                        </select>
                    </span>
                </label>
                <div>
                    <div class="mb-2 flex items-center justify-between">
                        <span class="text-xs font-medium leading-5 text-[#8B8B8B]">Time Limit</span>
                        <span class="text-sm font-semibold text-[#A41034]">Time Limit: 30 min</span>
                    </div>
                    <input type="range" min="0" max="4" value="2" class="h-2 w-full cursor-pointer accent-[#A41034]">
                    <div class="mt-2 flex justify-between text-[11px] font-medium text-[#8B8B8B]"><span>15m</span><span>20m</span><span class="font-semibold text-[#A41034]">30m</span><span>45m</span><span>60m</span></div>
                </div>
            </div>

            <div class="mt-5 flex justify-end">
                <button type="button" class="focus-ring flex h-11 min-w-[220px] items-center justify-center gap-2 rounded-[10px] bg-[#A41034] px-5 text-[13px] font-semibold text-white tracking-[0.3px] transition-all hover:-translate-y-0.5 hover:bg-[#7a0c26] hover:shadow-[0_12px_24px_rgba(164,16,52,0.22)] active:scale-95">
                    <i data-lucide="download" class="h-4 w-4"></i>
                    Generate & Download PDF
                </button>
            </div>
        </section>
    </main>

    <aside id="gradeToolbar" class="fixed bottom-20 left-4 right-4 z-40 hidden lg:bottom-auto lg:left-auto lg:right-4 lg:top-[calc(50%+1rem)] lg:-translate-y-1/2" aria-label="Quick navigation"></aside>

        const initialAnnouncements = [

        function escapeHtml(value = '') {
            return String(value)
                .replace(/&/g, '&amp;')
                .replace(/</g, '&lt;')
                .replace(/>/g, '&gt;')
                .replace(/"/g, '&quot;')
                .replace(/'/g, '&#039;');
        }

        function initialsFromName(name) {
            return name.split(/\s+/).filter(Boolean).slice(0, 2).map((part) => part[0]).join('').toUpperCase();
        }

        function audienceMatchesFilter(announcement, filter) {
            if (filter === 'All Grades') return true;
            if (announcement.audience === 'All Grades' || announcement.audience === filter) return true;

            const range = announcement.audience.match(/Grade\s+(\d+)\s*-\s*Grade\s+(\d+)/i);
            const grade = filter.match(/Grade\s+(\d+)/i);
            if (!range || !grade) return false;

            const gradeNumber = Number(grade[1]);
            return gradeNumber >= Number(range[1]) && gradeNumber <= Number(range[2]);
        }

        function renderAnnouncementText(text) {
            return text.split('\n\n')
                .map((paragraph) => `<p class="text-[15px] font-medium leading-7 text-[#44403C]">${escapeHtml(paragraph).replace(/\n/g, '<br>')}</p>`)
                .join('');
        }

        function renderAnnouncementMedia(media) {
            if (!media) return '';
            if (Array.isArray(media)) {
                return `
                    <div class="mt-5 grid gap-3 ${media.length > 1 ? 'sm:grid-cols-2' : ''}">
                        ${media.map((item) => `
                            <img src="${escapeHtml(item.url)}" alt="${escapeHtml(item.alt || '')}" class="h-64 w-full rounded-3xl object-cover">
                        `).join('')}
                    </div>
                `;
            }

            if (media.type === 'image') {
                return `
                    <div class="mt-5 overflow-hidden rounded-3xl bg-[#F5F5F4]">
                        <img src="${escapeHtml(media.url)}" alt="${escapeHtml(media.alt || '')}" class="max-h-[520px] w-full object-cover">
                    </div>
                `;
            }

            if (media.type === 'pdf') {
                return `
                    <div class="mt-5 flex items-center gap-4 rounded-3xl border border-[#E7E5E4] bg-[#F5F5F4] p-4">
                        <div class="grid h-12 w-12 shrink-0 place-items-center rounded-2xl bg-[#A41034] text-white">
                            <i data-lucide="file-text" class="h-5 w-5"></i>
                        </div>
                        <div class="min-w-0 flex-1">
                            <p class="truncate text-sm font-black text-[#1C1917]">${escapeHtml(media.name)}</p>
                            <p class="mt-0.5 text-[11px] font-bold  tracking-wider text-[#A8A29E]">PDF · ${escapeHtml(media.size)}</p>
                        </div>
                        <button type="button" class="focus-ring rounded-2xl bg-white px-4 py-2.5 text-[10px] font-black  tracking-wider text-[#A41034] transition hover:bg-[#fff7ed]">View</button>
                    </div>
                `;
            }

            if (media.type === 'video') {
                return `
                    <div class="relative mt-5 overflow-hidden rounded-3xl bg-[#1C1917]">
                        <img src="${escapeHtml(media.thumbnail)}" alt="${escapeHtml(media.alt || '')}" class="h-72 w-full object-cover opacity-80">
                        <button type="button" class="focus-ring absolute inset-0 grid place-items-center" aria-label="Play video">
                            <span class="grid h-16 w-16 place-items-center rounded-full bg-white/95 text-[#A41034] shadow-2xl">
                                <i data-lucide="play" class="h-7 w-7 fill-current"></i>
                            </span>
                        </button>
                    </div>
                `;
            }

            return '';
        }

        function renderReactions(announcement) {
            return Object.entries(announcement.reactions).map(([emoji, count]) => {
                const active = announcement.myReactions.has(emoji);
                return `
                    <button type="button" class="reaction-button focus-ring rounded-xl px-3 py-2 text-xs font-bold transition ${active ? 'bg-[#fff7ed] text-[#A41034] ring-1 ring-[#f59138]/30' : 'bg-[#F5F5F4] text-[#78716C] hover:bg-[#fff7ed] hover:text-[#A41034]'}" data-post-id="${announcement.id}" data-emoji="${escapeHtml(emoji)}">
                        <span aria-hidden="true">${emoji}</span>
                        <span>${count + (active ? 1 : 0)}</span>
                    </button>
                `;
            }).join('');
        }

        function renderAnnouncementCard(announcement) {
            const avatar = escapeHtml(initialsFromName(announcement.author));

            return `
                <article class="rounded-[2.5rem] border border-[#E7E5E4] bg-white p-6 shadow-[0_18px_48px_rgba(28,25,23,0.05)]">

                        <div class="flex min-w-0 items-center gap-4">

                            </div>
                        </div>
                        <span class="shrink-0 rounded-full bg-[#F5F5F4] px-3 py-1 text-xs font-bold  text-[#78716C]">${escapeHtml(announcement.audience)}</span>
                    </div>
                    <div class="space-y-3">${renderAnnouncementText(announcement.text)}</div>
                    ${renderAnnouncementMedia(announcement.media)}
                    <div class="mt-5 flex flex-wrap gap-2">${renderReactions(announcement)}</div>
                </article>
            `;
        }

        function renderCommunicationFeed() {
            const feed = document.getElementById('communicationFeed');
            const filter = communicationFilter;
            if (!feed) return;

            const filtered = initialAnnouncements.filter((announcement) => audienceMatchesFilter(announcement, filter));
            feed.innerHTML = filtered.length
                ? filtered.map(renderAnnouncementCard).join('')
                : '<div class="rounded-[2.5rem] border border-[#E7E5E4] bg-white p-10 text-center text-sm font-bold text-[#78716C]">No announcements for this grade.</div>';

            feed.querySelectorAll('.reaction-button').forEach((button) => {
                button.addEventListener('click', () => {
                    const post = initialAnnouncements.find((announcement) => announcement.id === Number(button.dataset.postId));
                    if (!post) return;
                    if (post.myReactions.has(button.dataset.emoji)) {
                        post.myReactions.delete(button.dataset.emoji);
                    } else {
                        post.myReactions.add(button.dataset.emoji);
                    }
                    renderCommunicationFeed();
                    lucide.createIcons();
                });
            });
        }

        function getCommunicationFilterLabel(filter) {
            if (filter === 'All Grades') return 'All';
            const grade = filter.match(/Grade\s+(\d+)/i);
            return grade ? `G${grade[1]}` : filter;
        }

            const toolbar = document.getElementById('communicationFilterToolbar');

        const LEARNOMETER_TEST = {
            name: 'Mathematics Unit Assessment',
            subject: 'Mathematics',
            grade: 'Grade 4',
            block: 'Block 03 - Fractions',
            duration: 30

        const LEARNOMETER_QUESTIONS = [
            { text: 'If 3 out of 8 equal parts of a shape are shaded, what fraction is shaded?', options: ['3/8', '5/8', '8/3', '1/3'], answer: 0 },
            { text: 'Which fraction is equivalent to 1/2?', options: ['2/4', '1/4', '3/4', '2/3'], answer: 0 },
            { text: 'What is 1/4 + 1/4?', options: ['2/4', '2/8', '1/8', '4/1'], answer: 0 },
            { text: 'Which of these fractions is the largest?', options: ['3/4', '1/2', '1/4', '2/5'], answer: 0 },
            { text: 'A pizza is cut into 6 equal slices. You eat 2. What fraction of the pizza remains?', options: ['4/6', '2/6', '6/4', '2/3'], answer: 0 },
            { text: 'What is 3/4 of 8?', options: ['6', '4', '3', '2'], answer: 0 },
            { text: 'Which of these is a proper fraction?', options: ['3/5', '5/3', '5/5', '6/3'], answer: 0 },
            { text: 'Simplify 4/8 to its lowest form.', options: ['1/2', '2/4', '4/8', '1/4'], answer: 0 },
            { text: 'What fraction of one hour is 15 minutes?', options: ['1/4', '1/2', '1/3', '3/4'], answer: 0 },
            { text: 'You have 2/5 of a ribbon. You add 1/5 more. What is the total?', options: ['3/5', '3/10', '2/10', '1/5'], answer: 0 }

        const learnometerState = {
            step: 'login',
            studentId: '',
            teacherCode: '',
            loginError: '',
            testType: null,
            currentQ: 0,
            selected: null,

            timeLeft: 0,
            testDone: false,
            timer: null
        };

        function learnometerLogo(size = 26) {
            return `<svg xmlns="http://www.w3.org/2000/svg" width="${size}" height="${size}" viewBox="0 0 24 24" fill="#f59138" stroke="#f59138" stroke-width="1.5" aria-hidden="true"><polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2" /></svg>`;
        }

        function formatLearnometerTime(secs) {
            const minutes = Math.floor(secs / 60).toString().padStart(2, '0');
            const seconds = (secs % 60).toString().padStart(2, '0');
            return `${minutes}:${seconds}`;
        }

        function stopLearnometerTimer() {
            if (learnometerState.timer) {
                clearInterval(learnometerState.timer);
                learnometerState.timer = null;
            }
        }

        function startLearnometerTimer() {
            stopLearnometerTimer();
            learnometerState.timer = setInterval(() => {
                if (learnometerState.step !== 'test' || learnometerState.testDone) {
                    stopLearnometerTimer();
                    return;
                }

                if (learnometerState.timeLeft <= 1) {
                    learnometerState.timeLeft = 0;
                    learnometerState.testDone = true;
                    stopLearnometerTimer();
                    renderLearnometer();
                    return;
                }

                learnometerState.timeLeft -= 1;
                const timerNode = document.getElementById('learnometerTimer');
                if (timerNode) timerNode.textContent = formatLearnometerTime(learnometerState.timeLeft);
            }, 1000);
        }

        function startLearnometerTest(type) {
            learnometerState.testType = type;
            learnometerState.currentQ = 0;
            learnometerState.selected = null;
            learnometerState.answers = [];
            learnometerState.timeLeft = LEARNOMETER_TEST.duration * 60;
            learnometerState.testDone = false;
            learnometerState.step = 'test';
            renderLearnometer();
            startLearnometerTimer();
        }

        function completeLearnometerQuestion() {
            learnometerState.answers[learnometerState.currentQ] = learnometerState.selected;

            if (learnometerState.currentQ + 1 >= LEARNOMETER_QUESTIONS.length) {
                learnometerState.testDone = true;
                stopLearnometerTimer();
            } else {
                learnometerState.currentQ += 1;
                learnometerState.selected = null;
            }

            renderLearnometer();
            if (learnometerState.step === 'test' && !learnometerState.testDone) startLearnometerTimer();
        }

        function resetLearnometer() {
            stopLearnometerTimer();
            learnometerState.step = 'login';
            learnometerState.studentId = '';
            learnometerState.teacherCode = '';
            learnometerState.loginError = '';
            learnometerState.testType = null;
            learnometerState.currentQ = 0;
            learnometerState.selected = null;
            learnometerState.answers = [];
            learnometerState.timeLeft = 0;
            learnometerState.testDone = false;
            renderLearnometer();
        }

                                        <input id="learnometerStudentId" type="text" value="${escapeHtml(learnometerState.studentId)}" placeholder="e.g. XS-2026-04821" class="w-full bg-transparent text-sm font-medium text-[#1C1917] placeholder-[#B8B2AE] outline-none">
                                    </span>
                                </div>
                                <div>
                                    <label class="mb-2 block text-xs font-medium leading-5 text-[#8B8B8B]">Teacher code</label>
                                    <span class="flex h-[52px] items-center gap-3 rounded-xl border border-[#E5E5E5] bg-[#FAFAFA] px-4 transition-all focus-within:border-[#A41034] focus-within:shadow-[0_0_0_3px_rgba(164,16,52,0.10)]">
                                        <i data-lucide="key-round" class="h-4 w-4 shrink-0 text-[#A41034]"></i>
                                        <input id="learnometerTeacherCode" type="text" value="${escapeHtml(learnometerState.teacherCode)}" placeholder="e.g. TCH-8842" class="w-full bg-transparent text-sm font-medium text-[#1C1917] placeholder-[#B8B2AE] outline-none">
                                    </span>
                                </div>
                            </div>
                            ${learnometerState.loginError ? `
                                <p class="mb-4 flex items-center gap-2 rounded-xl bg-red-50 px-3 py-2 text-[12px] font-medium text-red-600">
                                    <i data-lucide="circle-alert" class="h-3.5 w-3.5 shrink-0"></i>
                                    ${escapeHtml(learnometerState.loginError)}
                                </p>
                            ` : ''}

                                Sign in
                            </button>
                        </form>
                    </div>
                </section>
            `;
        }

        function renderLearnometerSelect() {
            return `
                <section class="flex min-h-[calc(100vh-80px)] items-center justify-center tab-content">
                    <div class="w-full max-w-lg">
                        <div class="fade-in mb-8 text-center">
                            <div class="mb-4 inline-flex items-center gap-2 rounded-full border border-amber-100 bg-[#fff7ed] px-4 py-2">
                                <div class="flex h-5 w-5 items-center justify-center rounded-lg bg-[#A41034]">${learnometerLogo(11)}</div>
