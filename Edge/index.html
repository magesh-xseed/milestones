        function getStatus(progress) {
            if (progress >= 90) return 'Completed';
            if (progress > 0) return 'In Progress';
            return 'Not Started';
        }

        function getStatusClass(status) {
            if (status === 'Completed') return 'bg-[#4CAF50]/10 text-[#2E7D32] border-[#4CAF50]/20';
            if (status === 'In Progress') return 'bg-[#f59138]/10 text-[#b75d13] border-[#f59138]/20';
            return 'bg-[#F5F5F4] text-[#78716C] border-[#E7E5E4]';
        }

        function getSequentialLessonProgress(blockProgress, lessonIndex, lessonCount) {
            const safeProgress = Math.max(0, Math.min(100, Number(blockProgress) || 0));
            const lessonStep = 100 / lessonCount;
            const completedLessons = Math.min(lessonCount, Math.floor(safeProgress / lessonStep));

            if (lessonIndex < completedLessons) {
                return { progress: 100, status: 'Completed' };
            }

            if (safeProgress > 0 && safeProgress < 100 && lessonIndex === completedLessons) {
                const progressIntoLesson = Math.round(((safeProgress - (completedLessons * lessonStep)) / lessonStep) * 100);
                return { progress: Math.max(1, Math.min(99, progressIntoLesson)), status: 'In Progress' };
            }

            return { progress: 0, status: 'Not Started' };
        }

        function getDistributedBlockProgress(subjectProgress, blockIndex, blockCount) {
            const safeProgress = Math.max(0, Math.min(100, Number(subjectProgress) || 0));
            if (safeProgress <= 0) return 0;
            if (safeProgress >= 100) return 100;

            const blockStart = (blockIndex / blockCount) * 100;
            const blockEnd = ((blockIndex + 1) / blockCount) * 100;

            if (safeProgress >= blockEnd) return 100;
            if (safeProgress <= blockStart) return 0;

            return Math.round(((safeProgress - blockStart) / (blockEnd - blockStart)) * 100);
        }

        function getSubjectBlocks(subject, gradeIndex, subjectIndex) {
            const titles = blockTitleLibrary[subject.name] || Array.from({ length: 15 }, (_, index) => `${subject.name} Block ${index + 1}`);
            return titles.slice(0, 15).map((title, blockIndex) => {
                const progress = getDistributedBlockProgress(subject.progress, blockIndex, titles.length);
                const lessons = lessonTypes.map((lesson, lessonIndex) => {
                    const lessonState = getSequentialLessonProgress(progress, lessonIndex, lessonTypes.length);
                    return {
                        id: `lesson-${lessonIndex + 1}`,
                        title: lesson.title,
                        description: lesson.description(title),
                        duration: lesson.duration,
                        stage: lesson.stage,
                        icon: lesson.icon,
                        progress: lessonState.progress,
                        status: lessonState.status
                    };
                });
                return {
                    id: `block-${blockIndex + 1}`,
                    title,
                    progress,
                    status: getStatus(progress),
                    lessons
                };
            });
        }

        function getSubjectSummary(subject) {
            const blocks = subject.blocks || [];
            const lessons = blocks.flatMap((block) => block.lessons.map((lesson) => ({
                ...lesson,
                blockId: block.id,
                blockTitle: block.title
            })));
            const inProgressLesson = lessons.find((lesson) => lesson.status === 'In Progress');
            const nextLesson = lessons.find((lesson) => lesson.status === 'Not Started');
            const completedLesson = [...lessons].reverse().find((lesson) => lesson.status === 'Completed');
            const completedLessons = lessons.filter((lesson) => lesson.status === 'Completed').length;
            const highlightedLesson = inProgressLesson || nextLesson || completedLesson || lessons[0];
            const lessonLinkLabel = inProgressLesson ? 'In Progress' : nextLesson ? 'Start Next' : completedLesson ? 'Completed' : 'View Lesson';
            const lessonLinkToneClass = inProgressLesson
                ? 'bg-[#f59138]/10 text-[#A41034]'
                : nextLesson
                    ? 'bg-[#A41034]/5 text-[#A41034]'
                    : completedLesson
                        ? 'bg-emerald-50 text-emerald-700'
                        : 'bg-[#F5F5F4] text-[#78716C]';

            return {
                totalBlocks: blocks.length,
                totalLessons: lessons.length,
                completedLessons,
                lessonLinkLabel,
                lessonLinkToneClass,
                lessonLinkAria: lessonLinkLabel.toLowerCase(),
                lastOpened: highlightedLesson ? highlightedLesson.blockTitle : 'No lesson available',
                lastBlockId: highlightedLesson ? highlightedLesson.blockId : blocks[0]?.id,
                status: getStatus(subject.progress)
            };
        }

        function getDemoSubjectProgress(gradeIndex, subjectIndex, baseProgress) {
            const preschoolProgress = [0, 18, 100];
            const primaryProgressByGrade = [
                [0, 24, 100, 48, 0, 72],
                [100, 0, 36, 58, 18, 100],
                [25, 100, 0, 64, 42, 88],
                [40, 0, 76, 100, 55, 22],
                [100, 68, 0, 84, 35, 100],
                [92, 100, 38, 0, 100, 61],
                [0, 44, 100, 72, 18, 100],
                [100, 56, 0, 96, 77, 100]
            ];

            if (gradeIndex < preschoolProgress.length) return preschoolProgress[gradeIndex];

            const gradeProgress = primaryProgressByGrade[gradeIndex - preschoolProgress.length];
            return gradeProgress ? gradeProgress[subjectIndex % gradeProgress.length] : baseProgress;
        }

        function buildGrade(id, title, sourceSubjects, gradeIndex) {
            return {
                id,
                title,
                subjects: sourceSubjects.map((subject, subjectIndex) => {
                    const progress = getDemoSubjectProgress(gradeIndex, subjectIndex, subject.progress);
                    const subjectWithProgress = { ...subject, progress };
                    return {
                        ...subjectWithProgress,
                        id: subject.name.toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/(^-|-$)/g, ''),
                        grade: title,
                        blocks: getSubjectBlocks(subjectWithProgress, gradeIndex, subjectIndex)
                    };
                })
            };
        }

        const curriculumByGrade = [
            buildGrade('nursery', 'Nursery', [subjectLibrary.earlyChildhood], 0),
            buildGrade('lkg', 'Lower Kindergarten (LKG)', [subjectLibrary.earlyChildhood], 1),
            buildGrade('ukg', 'Upper Kindergarten (UKG)', [subjectLibrary.earlyChildhood], 2),
            ...Array.from({ length: 8 }, (_, index) => buildGrade(`grade-${index + 1}`, `Grade ${index + 1}`, primarySubjects, index + 3))
        ];
        curriculumByGrade.forEach((grade) => expandedGradeIds.add(grade.id));

        function findGrade(gradeId) {
            return curriculumByGrade.find((grade) => grade.id === gradeId);
        }

        function findSubject(gradeId, subjectId) {
            const grade = findGrade(gradeId);
            return grade ? grade.subjects.find((subject) => subject.id === subjectId) : null;
        }

        function findBlock(gradeId, subjectId, blockId) {
            const subject = findSubject(gradeId, subjectId);
            return subject ? subject.blocks.find((block) => block.id === blockId) : null;
        }

        function renderProgress(value, color = 'var(--wine-red)', trackClass = 'bg-white') {
            const safeValue = Math.max(0, Math.min(100, Number(value) || 0));
            return `
                <div class="h-1.5 w-full ${trackClass} rounded-full overflow-hidden" role="progressbar" aria-valuenow="${safeValue}" aria-valuemin="0" aria-valuemax="100" aria-label="${safeValue}% complete">
                    <div class="h-full rounded-full" style="width: ${safeValue}%; background: ${color};"></div>
                </div>
            `;
        }

        function getStageStyle(stage) {
            const styles = {
                warm: {
                    badge: 'bg-amber-50 text-amber-700 border-amber-100',
                    icon: 'bg-amber-100 text-amber-700',
                    ring: 'group-hover:border-amber-200'
                },
                explore: {
                    badge: 'bg-sky-50 text-sky-700 border-sky-100',
                    icon: 'bg-sky-100 text-sky-700',
                    ring: 'group-hover:border-sky-200'
                },
                practice: {
                    badge: 'bg-emerald-50 text-emerald-700 border-emerald-100',
                    icon: 'bg-emerald-100 text-emerald-700',
                    ring: 'group-hover:border-emerald-200'
                },
                apply: {
                    badge: 'bg-violet-50 text-violet-700 border-violet-100',
                    icon: 'bg-violet-100 text-violet-700',
                    ring: 'group-hover:border-violet-200'
                },
                reflect: {
                    badge: 'bg-fuchsia-50 text-fuchsia-700 border-fuchsia-100',
                    icon: 'bg-fuchsia-100 text-fuchsia-700',
                    ring: 'group-hover:border-fuchsia-200'
                }
            };
            return styles[stage] || styles.practice;
        }

        function renderSubjectCard(subject, grade) {
            const summary = getSubjectSummary(subject);
            return `
                <article class="subject-card group bg-white rounded-[1.5rem] border border-[#E7E5E4] p-5 min-h-[205px] transition-all duration-300 ease-out hover:-translate-y-1 hover:border-[#A41034]/20 hover:shadow-xl hover:shadow-black/5 cursor-pointer focus-ring focus:outline-none" role="button" tabindex="0" aria-label="Open ${grade.title} ${subject.name} blocks" data-view="blocks" data-grade-id="${grade.id}" data-subject-id="${subject.id}">
                    <div class="mb-2 flex items-center justify-between gap-3">
                        <span class="truncate text-xs font-semibold text-[#78716C]">${grade.title}</span>
                    </div>

                    <h4 class="mb-1 truncate text-[1.35rem] font-bold text-[#1C1917]">${subject.name}</h4>
                    <p class="mb-3 text-sm font-medium text-[#78716C]">${summary.totalBlocks} Blocks • ${summary.totalLessons} Lessons</p>

                    <div class="mb-3.5 flex items-center gap-3">
                        <div class="flex-1">
                            ${renderProgress(subject.progress, 'var(--wine-red)', 'bg-[#F5F5F4]')}
                        </div>
                        <span class="shrink-0 text-sm font-semibold text-[#A41034]">${summary.completedLessons} / ${summary.totalLessons}</span>
                    </div>

                    <span class="group/lesson mb-4 flex max-w-full cursor-pointer items-center gap-3 rounded-xl px-3 py-2.5 text-left transition-all hover:border-[#A41034]/20 hover:bg-white hover:shadow-sm hover:shadow-[#A41034]/5 focus-ring focus:outline-none" role="link" tabindex="0" aria-label="Open ${summary.lessonLinkAria} lesson in ${summary.lastOpened}" data-view="lessons" data-grade-id="${grade.id}" data-subject-id="${subject.id}" data-block-id="${summary.lastBlockId}">
                     
                        <span class="min-w-0 flex-1 leading-tight">
                            <span class="block text-[10px] font-bold  tracking-wide text-[#A08E8A]">${summary.lessonLinkLabel}</span>
                            <span class="block truncate text-sm font-semibold text-[#1C1917] group-hover/lesson:text-[#A41034]">${summary.lastOpened}</span>
                        </span>
                        <span class="shrink-0 text-lg font-bold leading-none text-[#A41034] transition-transform duration-300 group-hover/lesson:translate-x-0.5" aria-hidden="true">→</span>
                    </span>

                    <div class="flex w-full items-center justify-center rounded-xl border border-[#A41034]/10 bg-[#A41034]/5 px-4 py-2.5 text-[11px] font-bold  tracking-wide text-[#A41034] transition-all duration-300 hover:border-[#A41034]/20 hover:bg-[#f59138]/10 hover:shadow-sm hover:shadow-[#A41034]/5">
                        <span>View Blocks</span>
                    </div>
                </article>
            `;
        }

        function getGradeSummary(grade) {
            const subjects = grade.subjects || [];
            const progress = subjects.length
                ? Math.round(subjects.reduce((sum, subject) => sum + subject.progress, 0) / subjects.length)
                : 0;

            return {
                subjectsCount: subjects.length,
                progress
            };
        }

        function getGradeBadgeLabel(grade) {
            if (grade.id === 'nursery') return 'NUR';
            if (grade.id === 'lkg') return 'LKG';
            if (grade.id === 'ukg') return 'UKG';

            const gradeNumber = grade.id.match(/^grade-(\d+)$/)?.[1];
            return gradeNumber ? `G${gradeNumber}` : grade.title;
        }

        function renderGradeSection(grade) {
            const isExpanded = expandedGradeIds.has(grade.id);
            const isCurrent = grade.id === currentGradeId;
            const summary = getGradeSummary(grade);
            return `
                <section id="grade-section-${grade.id}" class="scroll-mt-28 space-y-6 rounded-[2rem] p-5 md:p-6 mb-8" data-grade-section="${grade.id}" style="background: rgba(123, 3, 35, 0.025);">
                    <button type="button" class="focus-ring flex w-full cursor-pointer items-center justify-between text-left focus:outline-none ${isExpanded ? 'border-b border-[#E7E5E4] pb-4' : ''}" data-view="toggle-grade" data-grade-id="${grade.id}" aria-expanded="${isExpanded}">
                        <div class="flex items-center gap-3">
                            <span class="grid h-12 w-12 shrink-0 place-items-center rounded-2xl bg-[#A41034] text-sm font-bold text-white shadow-lg shadow-[#A41034]/20">${getGradeBadgeLabel(grade)}</span>
                            <div class="min-w-0">
                                <div class="flex items-center gap-2">
                                    <h2 class="text-sm font-bold tracking-wide text-[#A41034] uppercase">${grade.title}</h2>
                                    ${isCurrent ? '<span class="rounded-full bg-[#f59138]/15 px-2.5 py-1 text-[9px] font-semibold  tracking-wide text-[#A41034]">Current</span>' : ''}
                                </div>
                                <p class="mt-1 text-sm font-medium normal-case tracking-normal text-[#78716C]">${summary.subjectsCount} subjects • ${summary.progress}% progress</p>
                            </div>
                        </div>
                        <svg class="h-5 w-5 shrink-0 text-[#A41034] transition-transform duration-300 ${isExpanded ? 'rotate-180' : ''}" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="m6 9 6 6 6-6"/></svg>
                    </button>
                    ${isExpanded ? `
                        <div class="grid grid-cols-1 lg:grid-cols-3 gap-8">
                            ${grade.subjects.map((subject) => renderSubjectCard(subject, grade)).join('')}
                        </div>
                    ` : ''}
                </section>
            `;
        }

        function renderBlocksPage(gradeId, subjectId) {
            const grade = findGrade(gradeId);
            const subject = findSubject(gradeId, subjectId);
            if (!grade || !subject) return renderHome();
            const collapsedCount = subject.blocks.filter((block) => collapsedBlockIds.has(`${grade.id}:${subject.id}:${block.id}`)).length;
            const allBlocksCollapsed = collapsedCount === subject.blocks.length;

            return `
                <section class="space-y-8">
                    <header class="sticky top-24 z-30 -mx-6 border-b border-[#E7E5E4] bg-[#FBF9F7]/95 px-6 py-4 backdrop-blur-xl">
                        <div class="mx-auto flex max-w-[1280px] items-center justify-between gap-4">
                            <div class="flex min-w-0 items-center gap-4">
                                <div class="min-w-0">
                                    <h1 class="truncate text-2xl font-bold text-[#1C1917]">${grade.title} ${subject.name}</h1>
                                    <p class="mt-1 text-sm font-medium text-[#78716C]">${subject.blocks.length} blocks • ${subject.blocks.reduce((sum, block) => sum + block.lessons.length, 0)} lessons</p>
                                </div>
                            </div>
                            <div class="flex shrink-0 items-center gap-4">
                                <button type="button" class="focus-ring cursor-pointer rounded-full border border-[#A41034]/10 bg-white/70 px-4 py-2 text-[11px] font-bold  tracking-wide text-[#A41034] transition-all hover:bg-[#A41034]/5 focus:outline-none" data-view="toggle-all-blocks" data-grade-id="${grade.id}" data-subject-id="${subject.id}">
                                    ${allBlocksCollapsed ? 'Expand all' : 'Collapse all'}
                                </button>
                            </div>
                        </div>
                    </header>
                    ${subject.blocks.map((block, index) => renderBlockSection(block, index, grade, subject)).join('')}
                </section>
            `;
        }

        function getLessonDisplayStatus(lesson) {
            return lesson.status;
        }

        function getLessonStatusClass(status) {
            if (status === 'Completed') return 'bg-[#A41034]/5 text-[#A41034]';
            if (status === 'In Progress') return 'bg-[#f59138]/15 text-[#A41034]';
            return 'bg-[#F5F5F4] text-[#78716C]';
        }

        function renderStatusMark(status) {
            if (status === 'Completed') {
                return '<svg xmlns="http://www.w3.org/2000/svg" width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"/></svg>';
            }
            return '';
        }

        function renderBlockSection(block, blockIndex, grade, subject) {
            const blockKey = `${grade.id}:${subject.id}:${block.id}`;
            const isExpanded = !collapsedBlockIds.has(blockKey);
            const progressState = block.progress >= 100 ? 'Complete' : block.progress > 0 ? 'In progress' : 'Not started';
            const completedLessons = block.lessons.filter((lesson) => lesson.status === 'Completed').length;
            return `
                <section id="block-section-${blockKey}" class="scroll-mt-56 rounded-[2rem] p-5 md:p-6" data-block-section="${blockKey}" style="scroll-margin-top: 13rem; background: rgba(123, 3, 35, 0.025);">
                    <button type="button" class="focus-ring relative mb-0 flex w-full cursor-pointer flex-col gap-3 pr-12 text-left focus:outline-none sm:flex-row sm:items-center sm:justify-between sm:pr-14" data-view="toggle-block" data-block-key="${blockKey}" aria-expanded="${isExpanded}">
                        <div class="flex min-w-0 items-center gap-4">
                            <span class="grid h-12 w-12 shrink-0 place-items-center rounded-2xl bg-[#A41034] text-sm font-bold text-white shadow-lg shadow-[#A41034]/20">B${blockIndex + 1}</span>
                            <div class="min-w-0">
                                <p class="text-[11px] font-semibold  tracking-wide text-[#A41034]">Block ${blockIndex + 1}</p>
                                <h2 class="truncate text-xl font-bold text-[#1C1917]">${block.title}</h2>
                               
                            </div>
                        </div>
                        <div class="w-full sm:w-72">
                            <div class="mb-2 flex items-center justify-between gap-3">
                                <span class="text-[11px] font-bold  tracking-wide text-[#A08E8A]">${progressState}</span>
                                <span class="shrink-0 rounded-full bg-[#A41034]/10 px-2.5 py-1 text-xs font-black text-[#A41034]">${completedLessons}/${block.lessons.length}</span>
                            </div>
                            ${renderProgress(block.progress)}
                        </div>
                        <span class="absolute right-0 top-1/2 grid h-10 w-10 -translate-y-1/2 place-items-center rounded-full border border-[#A41034]/10 bg-white text-[#A41034] shadow-md shadow-[#A41034]/10 transition-all duration-300 hover:border-[#A41034]/25 hover:bg-[#A41034]/5" aria-hidden="true">
                            <svg class="h-5 w-5 transition-transform duration-300 ${isExpanded ? 'rotate-180' : ''}" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="m6 9 6 6 6-6"/></svg>
                        </span>
                    </button>
                    ${isExpanded ? `
                        <div class="grid grid-cols-1 gap-4 md:grid-cols-2 xl:grid-cols-3 mt-5">
                            ${block.lessons.map((lesson, lessonIndex) => renderLessonCard(lesson, lessonIndex, block, grade, subject)).join('')}
                        </div>
                    ` : ''}
                </section>
            `;
        }

        function renderLessonCard(lesson, lessonIndex, block, grade, subject) {
            const displayStatus = getLessonDisplayStatus(lesson);
            return `
                <article class="focus-ring group grid min-h-[148px] cursor-pointer grid-cols-[88px_1fr] gap-4 rounded-[1.25rem] border border-transparent bg-white p-3 shadow-sm shadow-black/[0.025] transition-all duration-300 hover:-translate-y-0.5 hover:border-[#A41034]/25 hover:shadow-xl hover:shadow-black/5" role="button" tabindex="0" aria-label="Open ${lesson.title}" data-view="lessons" data-grade-id="${grade.id}" data-subject-id="${subject.id}" data-block-id="${block.id}">
                    <img src="assets/light-shadow.jpeg" alt="${lesson.title}" class="h-full min-h-[124px] w-[88px] rounded-2xl object-cover">
                    <div class="flex min-w-0 flex-col">
                        <div class="mb-2 flex items-start justify-between gap-3">
                            <h3 class="line-clamp-2 text-base font-semibold leading-6 text-[#1C1917]">${lesson.title}</h3>
                        </div>
                        <p class="line-clamp-2 text-sm font-medium leading-5 text-[#6D5D5A]">${lesson.description}</p>
                        <div class="mt-auto flex items-center justify-between gap-3 pt-4">
                            <span class="inline-flex items-center gap-1.5 rounded-full px-2.5 py-1 text-[10px] font-semibold  tracking-wide ${getLessonStatusClass(displayStatus)}">
                                ${renderStatusMark(displayStatus)}
                                ${displayStatus}
                            </span>
                            <span class="text-xs font-bold text-[#A08E8A]">${lesson.duration}</span>
                        </div>
                    </div>
                </article>
            `;
        }

        function renderLessonsPage(gradeId, subjectId, blockId) {
            const grade = findGrade(gradeId);
            const subject = findSubject(gradeId, subjectId);
            const block = findBlock(gradeId, subjectId, blockId);
            if (!grade || !subject || !block) return renderHome();

            return `
                <section class="space-y-8">
                    <button type="button" class="focus-ring inline-flex cursor-pointer items-center gap-2 rounded-2xl border border-[#E7E5E4] bg-white px-5 py-3 text-[11px] font-bold  tracking-wide text-[#A41034] transition-all hover:border-[#A41034]/30 hover:bg-[#A41034]/5 focus:outline-none" data-view="blocks" data-grade-id="${grade.id}" data-subject-id="${subject.id}">
                        <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="m15 18-6-6 6-6"/></svg>
                        <span>Back to Blocks</span>
                    </button>
                    <header class="rounded-[2.5rem] border border-[#E7E5E4] bg-white p-8 md:p-10">
                        <span class="text-[10px] font-semibold text-[#78716C] tracking-wide ">${grade.title} / ${subject.name}</span>
                        <h1 class="mt-2 text-4xl font-bold text-[#1C1917]">${block.title}</h1>
                        <div class="mt-5 flex flex-wrap items-center gap-3">
                            <span class="rounded-full border px-3 py-1 text-[10px] font-semibold  tracking-wide ${getStatusClass(block.status)}">${block.status}</span>
                            <span class="text-sm font-bold text-[#A41034]">${block.progress}% Progress</span>
                            <span class="text-sm font-semibold text-[#78716C]">${block.lessons.length} Lessons</span>
                        </div>
                    </header>
                    <div class="space-y-4">
                        ${block.lessons.map((lesson, index) => renderLessonRow(lesson, index)).join('')}
                    </div>
                </section>
            `;
        }

        function renderLessonRow(lesson, index) {
            const actionLabel = lesson.status === 'Completed' ? 'Review' : lesson.status === 'In Progress' ? 'Continue' : 'Start';
            return `
                <article class="grid gap-5 rounded-[2rem] border border-[#E7E5E4] bg-white p-5 transition-all hover:shadow-xl hover:shadow-black/5 md:grid-cols-[auto_1fr_auto] md:items-center md:p-6">
                    <div class="grid h-12 w-12 place-items-center rounded-2xl bg-[#A41034]/5 text-sm font-bold text-[#A41034]">${index + 1}</div>
                    <div>
                        <div class="flex flex-wrap items-center gap-3">
                            <h2 class="text-xl font-semibold text-[#1C1917]">${lesson.title}</h2>
                            <span class="rounded-full border px-3 py-1 text-[10px] font-semibold  tracking-wide ${getStatusClass(lesson.status)}">${lesson.status}</span>
                        </div>
                        <div class="mt-3 grid gap-3 md:grid-cols-[1fr_auto] md:items-center">
                            ${renderProgress(lesson.progress)}
                            <span class="text-sm font-bold text-[#78716C]">${lesson.duration}</span>
                        </div>
                    </div>
                    <button type="button" class="focus-ring cursor-pointer rounded-2xl bg-[#A41034] px-6 py-4 text-[11px] font-bold  tracking-wide text-white transition-all hover:bg-[#5a0219] focus:outline-none">${actionLabel}</button>
                </article>
            `;
        }


        function renderHome() {
            const allExpanded = expandedGradeIds.size === curriculumByGrade.length;
            return `
                <div class="flex items-center justify-between gap-4">
                     <p class="truncate text-2xl font-bold text-[#1C1917]">Grade-wise Subjects</p>
                    <button type="button" class="focus-ring cursor-pointer rounded-full border border-[#A41034]/10 bg-white/70 px-4 py-2 text-[11px] font-bold  tracking-wide text-[#A41034] transition-all hover:bg-[#A41034]/5 focus:outline-none" data-view="toggle-all">
                        ${allExpanded ? 'Collapse all' : 'Expand all'}
                    </button>
                </div>
                <div class="mt-6" style="margin-top: 2rem;">
                    ${curriculumByGrade.map(renderGradeSection).join('')}
                </div>
            `;
        }

        function isDesktopToolbar() {
            return window.matchMedia('(min-width: 1024px)').matches;
        }

        function updateToolbarVisibility() {
            const toolbar = document.getElementById('gradeToolbar');
            const toggle = document.getElementById('toolbarToggle');
            const hasToolbar = currentToolbarView === 'home' || currentToolbarView === 'blocks';

            if (!toolbar || !toggle) return;

            if (!hasToolbar || (activeAppTab !== 'Teacher Lesson Plan' && activeAppTab !== 'Parent Lesson Plan')) {
                toolbar.classList.add('hidden');
                toggle.classList.add('hidden');
                toggle.classList.remove('grid');
                toggle.setAttribute('aria-expanded', 'false');
                return;
            }

            toggle.classList.toggle('hidden', isDesktopToolbar());
            toggle.classList.toggle('grid', !isDesktopToolbar());
            toolbar.classList.toggle('hidden', !isDesktopToolbar() && !toolbarOpen);
            toggle.setAttribute('aria-expanded', String(toolbarOpen));
        }

        function renderGradeToolbar(view, params = new URLSearchParams()) {
            const toolbar = document.getElementById('gradeToolbar');
            if (!toolbar) return;
            currentToolbarView = view;

            if (view !== 'home' && view !== 'blocks') {
                toolbar.innerHTML = '';
                toolbarOpen = false;
                updateToolbarVisibility();
                return;
            }

            if (view === 'blocks') {
                const grade = findGrade(params.get('grade'));
                const subject = findSubject(params.get('grade'), params.get('subject'));

                if (!grade || !subject) {
                    toolbar.innerHTML = '';
                    toolbarOpen = false;
                    updateToolbarVisibility();
                    return;
                }

                if (!activeBlockKey || !subject.blocks.some((block) => `${grade.id}:${subject.id}:${block.id}` === activeBlockKey)) {
                    activeBlockKey = `${grade.id}:${subject.id}:${subject.blocks[0]?.id || ''}`;
                }

                toolbar.innerHTML = `
                    <nav class="mx-auto flex max-w-[min(28rem,calc(100vw-2rem))] flex-row flex-wrap items-center justify-center gap-2 rounded-[2rem] border border-[#A41034]/10 bg-white/85 p-2.5 shadow-[0_18px_50px_rgba(123,3,35,0.12)] backdrop-blur-2xl lg:max-w-none lg:flex-col lg:gap-1 lg:p-2" aria-label="Jump to block">
                        ${subject.blocks.map((block, index) => {
                            const blockKey = `${grade.id}:${subject.id}:${block.id}`;
                            return `
                                <button type="button" class="group/tip relative focus-ring grid h-9 min-w-9 place-items-center rounded-full px-2 text-[11px] font-bold text-[#A41034] transition-all duration-300 hover:-translate-y-0.5 hover:bg-[#A41034]/5 hover:text-[#5a0219] focus:outline-none lg:h-7 lg:min-w-7 lg:px-1.5 lg:text-[10px] ${blockKey === activeBlockKey ? 'bg-[#f59138]/15 ring-1 ring-[#f59138]/30' : ''}" data-view="jump-block" data-block-key="${blockKey}" aria-label="Jump to Block ${index + 1}">
                                    <span>B${index + 1}</span>
                                    <span class="pointer-events-none absolute right-full top-1/2 mr-3 hidden -translate-y-1/2 whitespace-nowrap rounded-lg border border-[#A41034]/10 bg-[#fffaf3] px-2.5 py-1.5 text-[11px] font-semibold text-[#A41034] opacity-0 shadow-lg shadow-[#A41034]/10 transition-all duration-200 group-hover/tip:translate-x-0 group-hover/tip:opacity-100 group-focus-visible/tip:translate-x-0 group-focus-visible/tip:opacity-100 lg:block">Block ${index + 1}</span>
                                </button>
                            `;
                        }).join('')}
                    </nav>
                `;
                updateToolbarVisibility();
                return;
            }

            toolbar.innerHTML = `
                <nav class="mx-auto flex max-w-[min(28rem,calc(100vw-2rem))] flex-row flex-wrap items-center justify-center gap-2 rounded-[2rem] border border-[#A41034]/10 bg-white/85 p-2.5 shadow-[0_18px_50px_rgba(123,3,35,0.12)] backdrop-blur-2xl lg:max-w-none lg:flex-col lg:gap-1 lg:p-2" aria-label="Jump to grade">
                    ${curriculumByGrade.map((grade) => `
                        <button type="button" class="group/tip relative focus-ring grid h-9 min-w-9 place-items-center rounded-full px-2 text-[11px] font-bold text-[#A41034] transition-all duration-300 hover:-translate-y-0.5 hover:bg-[#A41034]/5 hover:text-[#5a0219] focus:outline-none lg:h-7 lg:min-w-7 lg:px-1.5 lg:text-[10px] ${grade.id === activeGradeId ? 'bg-[#f59138]/15 ring-1 ring-[#f59138]/30' : ''}" data-view="jump-grade" data-grade-id="${grade.id}" aria-label="Jump to ${grade.title}">
                            <span>${getGradeBadgeLabel(grade)}</span>
                            <span class="pointer-events-none absolute right-full top-1/2 mr-3 hidden -translate-y-1/2 whitespace-nowrap rounded-lg border border-[#A41034]/10 bg-[#fffaf3] px-2.5 py-1.5 text-[11px] font-semibold text-[#A41034] opacity-0 shadow-lg shadow-[#A41034]/10 transition-all duration-200 group-hover/tip:translate-x-0 group-hover/tip:opacity-100 group-focus-visible/tip:translate-x-0 group-focus-visible/tip:opacity-100 lg:block">${grade.title}</span>
                        </button>
                    `).join('')}
                </nav>
            `;
            updateToolbarVisibility();
        }

        function renderRoute() {
            const outlet = document.getElementById('curriculum-sections');
            const heroSection = document.querySelector('.today-fade-in');
            const hash = window.location.hash.replace(/^#/, '');
            const params = new URLSearchParams(hash);
            const view = params.get('view') || 'home';

            if (view === 'blocks') {
                heroSection.classList.add('hidden');
                outlet.innerHTML = renderBlocksPage(params.get('grade'), params.get('subject'));
                renderGradeToolbar(view, params);
            } else if (view === 'lessons') {
                heroSection.classList.add('hidden');
                outlet.innerHTML = renderLessonsPage(params.get('grade'), params.get('subject'), params.get('block'));
                renderGradeToolbar(view, params);
            } else {
                heroSection.classList.remove('hidden');
                outlet.innerHTML = renderHome();
                renderGradeToolbar(view, params);
            }
        }

        document.addEventListener('click', (event) => {
            const target = event.target.closest('[data-view]');
            if (!target) return;

            if (target.dataset.view === 'jump-grade') {
                const gradeId = target.dataset.gradeId;
                activeGradeId = gradeId;
                toolbarOpen = false;
                if (!expandedGradeIds.has(gradeId)) {
                    expandedGradeIds.add(gradeId);
                }
                renderRoute();

                requestAnimationFrame(() => {
                    document.getElementById(`grade-section-${gradeId}`)?.scrollIntoView({
                        behavior: 'smooth',
                        block: 'start'
                    });
                });
                return;
            }

            if (target.dataset.view === 'jump-block') {
                const blockKey = target.dataset.blockKey;
                activeBlockKey = blockKey;
                toolbarOpen = false;
                if (collapsedBlockIds.has(blockKey)) {
                    collapsedBlockIds.delete(blockKey);
                    renderRoute();
                } else {
                    renderGradeToolbar('blocks', new URLSearchParams(window.location.hash.replace(/^#/, '')));
                }

                requestAnimationFrame(() => {
                    document.getElementById(`block-section-${blockKey}`)?.scrollIntoView({
                        behavior: 'smooth',
                        block: 'start'
                    });
                });
                return;
            }

            if (target.dataset.view === 'toggle-all') {
                if (expandedGradeIds.size === curriculumByGrade.length) {
                    expandedGradeIds.clear();
                    expandedGradeIds.add(currentGradeId);
                } else {
                    curriculumByGrade.forEach((grade) => expandedGradeIds.add(grade.id));
                }
                renderRoute();
                return;
            }

            if (target.dataset.view === 'toggle-grade') {
                const gradeId = target.dataset.gradeId;
                activeGradeId = gradeId;
                if (expandedGradeIds.has(gradeId)) {
                    expandedGradeIds.delete(gradeId);
                } else {
                    expandedGradeIds.add(gradeId);
                }
                renderRoute();
                return;
            }

            if (target.dataset.view === 'toggle-block') {
                const blockKey = target.dataset.blockKey;
                if (collapsedBlockIds.has(blockKey)) {
                    collapsedBlockIds.delete(blockKey);
                } else {
                    collapsedBlockIds.add(blockKey);
                }
                renderRoute();
                return;
            }

            if (target.dataset.view === 'toggle-all-blocks') {
                const grade = findGrade(target.dataset.gradeId);
                const subject = findSubject(target.dataset.gradeId, target.dataset.subjectId);
                if (!grade || !subject) return;

                const keys = subject.blocks.map((block) => `${grade.id}:${subject.id}:${block.id}`);
                const allCollapsed = keys.every((key) => collapsedBlockIds.has(key));
                if (allCollapsed) {
                    keys.forEach((key) => collapsedBlockIds.delete(key));
                } else {
                    keys.forEach((key) => collapsedBlockIds.add(key));
                }
                renderRoute();
                return;
            }

            if (target.dataset.view === 'home') {
                window.location.hash = '';
                return;
            }

            if (target.dataset.view === 'blocks') {
                window.location.hash = `view=blocks&grade=${target.dataset.gradeId}&subject=${target.dataset.subjectId}`;
                return;
            }

            if (target.dataset.view === 'lessons') {
                window.location.hash = `view=lessons&grade=${target.dataset.gradeId}&subject=${target.dataset.subjectId}&block=${target.dataset.blockId}`;
            }
        });

        document.addEventListener('keydown', (event) => {
            if (event.key !== 'Enter' && event.key !== ' ') return;
            const target = event.target.closest('[data-view]');
            if (!target) return;
            event.preventDefault();
            target.click();
        });

        let scrollSyncFrame = null;
        function getActiveSection(sections, anchorY) {
            return sections.reduce((current, section) => {
                const top = section.getBoundingClientRect().top;
                if (top <= anchorY) return section;
                return current;
            }, sections[0]);
        }

        function syncActiveToolbarFromScroll() {
            const hash = window.location.hash.replace(/^#/, '');
            const params = new URLSearchParams(hash);
            const view = params.get('view') || 'home';

            if (view === 'blocks') {
                const sections = Array.from(document.querySelectorAll('[data-block-section]'));
                if (!sections.length) return;

                const activeSection = getActiveSection(sections, 190);
                const nextBlockKey = activeSection.dataset.blockSection;

                if (nextBlockKey && nextBlockKey !== activeBlockKey) {
                    activeBlockKey = nextBlockKey;
                    renderGradeToolbar('blocks', params);
                }
                return;
            }

            if (view === 'home') {
                const sections = Array.from(document.querySelectorAll('[data-grade-section]'));
                if (!sections.length) return;

                const activeSection = getActiveSection(sections, 170);
                const nextGradeId = activeSection.dataset.gradeSection;

                if (nextGradeId && nextGradeId !== activeGradeId) {
                    activeGradeId = nextGradeId;
                    renderGradeToolbar('home', params);
                }
            }
        }

        window.addEventListener('scroll', () => {
            if (scrollSyncFrame) return;
            scrollSyncFrame = requestAnimationFrame(() => {
                scrollSyncFrame = null;
                syncActiveToolbarFromScroll();
            });
        }, { passive: true });

        const menuToggle = document.getElementById('menuToggle');
        const mobileMenu = document.getElementById('mobileMenu');

        menuToggle?.addEventListener('click', () => {
            const isExpanded = menuToggle.getAttribute('aria-expanded') === 'true';
            menuToggle.setAttribute('aria-expanded', String(!isExpanded));
            mobileMenu?.classList.toggle('hidden', isExpanded);
        });

        const navButtons = Array.from(document.querySelectorAll('.nav-button[data-nav-title]'));
        const tabPanels = Array.from(document.querySelectorAll('.tab-panel[data-tab-panel]'));

        function showAppTab(title) {
            activeAppTab = title;
            const visiblePanel = title === 'Parent Lesson Plan' ? 'Teacher Lesson Plan' : title;
            tabPanels.forEach((panel) => {
                panel.classList.toggle('hidden', panel.dataset.tabPanel !== visiblePanel);
            });

            if (visiblePanel !== 'Learnometer') {
                stopLearnometerTimer();
            }

            if (visiblePanel === 'Teacher Lesson Plan') {
                renderCommunicationFilterToolbar();
                if (window.location.hash) {
                    window.location.hash = '';
                }
                renderRoute();
                window.scrollTo({ top: 0, behavior: 'smooth' });
            } else {
                if (visiblePanel === 'Communication') {
                    renderCommunicationFilterToolbar();
                    renderCommunicationFeed();
                    lucide.createIcons();
                } else {
                    renderCommunicationFilterToolbar();
                }
                if (visiblePanel === 'Learnometer') {
                    renderLearnometer();
                    if (learnometerState.step === 'test' && !learnometerState.testDone) startLearnometerTimer();
                }
                toolbarOpen = false;
                updateToolbarVisibility();
                window.scrollTo({ top: 0, behavior: 'smooth' });
            }
        }

        function setActiveNavTitle(title) {
            navButtons.forEach((button) => {
                const isActive = button.dataset.navTitle === title;
                button.classList.toggle('active', isActive);
                button.classList.toggle('text-[#6D5D5A]', !isActive);
                if (isActive) {
                    button.setAttribute('aria-current', 'page');
                } else {
                    button.removeAttribute('aria-current');
                }
            });
        }

        navButtons.forEach((button) => {
            button.addEventListener('click', () => {
                const title = button.dataset.navTitle;
                setActiveNavTitle(title);
                showAppTab(title);
                if (mobileMenu && !mobileMenu.classList.contains('hidden')) {
                    mobileMenu.classList.add('hidden');
                    menuToggle?.setAttribute('aria-expanded', 'false');
                }
            });
        });

        const profileToggle = document.getElementById('profileToggle');
        const profileMenu = document.getElementById('profileMenu');

        function setProfileMenuOpen(isOpen) {
            profileToggle?.setAttribute('aria-expanded', String(isOpen));
            profileMenu?.classList.toggle('hidden', !isOpen);
        }

        profileToggle?.addEventListener('click', (event) => {
            event.stopPropagation();
            const isExpanded = profileToggle.getAttribute('aria-expanded') === 'true';
            setProfileMenuOpen(!isExpanded);
        });

        profileMenu?.addEventListener('click', (event) => {
            event.stopPropagation();
        });

        document.addEventListener('click', () => {
            setProfileMenuOpen(false);
        });

        const toolbarToggle = document.getElementById('toolbarToggle');
        toolbarToggle?.addEventListener('click', () => {
            toolbarOpen = !toolbarOpen;
            updateToolbarVisibility();
        });

        window.addEventListener('resize', updateToolbarVisibility);
        window.addEventListener('hashchange', renderRoute);
        renderRoute();
        renderCommunicationFeed();
        renderCommunicationFilterToolbar();
        renderLearnometer();
        showAppTab(activeAppTab);
        lucide.createIcons();
    </script>
</body>
</html>
