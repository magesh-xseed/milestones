<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SuperTeacher Edge</title>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet" />
  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html { scroll-behavior: smooth; }
    body {
      background: #F8F5F2;
      font-family: 'Plus Jakarta Sans', sans-serif;
      color: #1a1210;
      min-height: 100vh;
      -webkit-font-smoothing: antialiased;
    }
    ::-webkit-scrollbar { width: 6px; }
    ::-webkit-scrollbar-track { background: #F8F5F2; }
    ::-webkit-scrollbar-thumb { background: #D6C3A5; border-radius: 99px; }
  </style>
</head>
<body>
<div id="root"></div>
<script type="text/babel">
const { useState, useRef, useEffect } = React;

// ─── Data ────────────────────────────────────────────────────────────────────
const todayLesson = {
  subject: "Mathematics",
  grade: "Grade 4",
  blockNumber: 7,
  blockName: "Fractions & Decimals",
  lessonNumber: 3,
  lessonName: "Comparing Fractions on a Number Line",
  duration: "45 min",
  tag: "Core Concept",

const subjectColors = {

  "English":        { color: "#7a3fa0", bg: "rgba(122,63,160,0.07)", border: "rgba(122,63,160,0.18)" },
  "Science":        { color: "#1e8a5e", bg: "rgba(30,138,94,0.07)",  border: "rgba(30,138,94,0.18)"  },
  "Social Studies": { color: "#c47a1a", bg: "rgba(196,122,26,0.07)", border: "rgba(196,122,26,0.18)" },
};
const defaultSubjectColor = { color: "#a51034", bg: "rgba(164,16,52,0.07)", border: "rgba(164,16,52,0.18)" };

const gradeSubjects = [
  {
    grade: "Grade 3",
    color: "#a51034",
    subjects: [
      { subject: "Mathematics", blockNumber: 5, blockName: "Multiplication Basics", lessonNumber: 6, lessonName: "Arrays & Equal Groups", progress: 72 },
      { subject: "English", blockNumber: 8, blockName: "Reading Comprehension", lessonNumber: 2, lessonName: "Main Idea & Details", progress: 18 },
      { subject: "Science", blockNumber: 3, blockName: "Plant Life Cycles", lessonNumber: 7, lessonName: "Seeds to Sprouts", progress: 90 },
    ]
  },
  {
    grade: "Grade 4",
    color: "#a51034",
    subjects: [
      { subject: "Mathematics", blockNumber: 7, blockName: "Fractions & Decimals", lessonNumber: 3, lessonName: "Comparing Fractions on a Number Line", progress: 31 },
      { subject: "English", blockNumber: 6, blockName: "Narrative Writing", lessonNumber: 5, lessonName: "Building Story Arcs", progress: 55 },
      { subject: "Science", blockNumber: 4, blockName: "States of Matter", lessonNumber: 1, lessonName: "Solids, Liquids & Gases", progress: 8 },
      { subject: "Social Studies", blockNumber: 9, blockName: "Early Civilizations", lessonNumber: 4, lessonName: "Rivers & Ancient Societies", progress: 63 },
    ]
  },
  {
    grade: "Grade 5",
    color: "#a51034",
    subjects: [
      { subject: "Mathematics", blockNumber: 11, blockName: "Geometry Foundations", lessonNumber: 2, lessonName: "Angles & Polygons", progress: 44 },
      { subject: "English", blockNumber: 10, blockName: "Persuasive Writing", lessonNumber: 6, lessonName: "Evidence & Counterarguments", progress: 77 },
      { subject: "Science", blockNumber: 6, blockName: "Ecosystems", lessonNumber: 3, lessonName: "Food Webs & Energy Flow", progress: 20 },
    ]
  },
];

const navTabs = [
  "Teacher Lesson Plan",
  "Parent Lesson Plan",
  "Communication",
  "Learnometer",
  "Practice Gym",
];

// ─── Components ──────────────────────────────────────────────────────────────

function Logo() {
  return (
    <div style={{ display: "flex", alignItems: "center", gap: 10, cursor: "pointer" }}>
      <div style={{
        width: 34, height: 34, borderRadius: 9,
        background: "#a51034",
        display: "flex", alignItems: "center", justifyContent: "center",
      }}>
        <svg width="18" height="18" viewBox="0 0 18 18" fill="none">
          <path d="M3 14L9 4L15 14" stroke="white" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"/>
          <path d="M5.5 10.5H12.5" stroke="white" strokeWidth="2" strokeLinecap="round"/>
        </svg>
      </div>
      <span style={{ fontWeight: 800, fontSize: 17, letterSpacing: "-0.02em", color: "#1a1210" }}>
        SuperTeacher <span style={{ color: "#a51034" }}>Edge</span>
      </span>
    </div>
  );
}

function ProfileMenu({ open, onClose }) {
  const ref = useRef();
  useEffect(() => {
    if (!open) return;
    const handler = (e) => { if (ref.current && !ref.current.contains(e.target)) onClose(); };
    document.addEventListener("mousedown", handler);
    return () => document.removeEventListener("mousedown", handler);
  }, [open, onClose]);

  const items = ["Profile", "Front Office", "Content Generation System"];
  return (
    <div ref={ref} style={{
      position: "absolute", top: "calc(100% + 10px)", right: 0,
      background: "white", borderRadius: 14, padding: "6px",
      boxShadow: "0 8px 32px rgba(26,18,16,0.12), 0 1px 4px rgba(26,18,16,0.06)",
      minWidth: 210, zIndex: 200,
      opacity: open ? 1 : 0, pointerEvents: open ? "all" : "none",
      transform: open ? "translateY(0)" : "translateY(-6px)",
      transition: "all 0.18s ease",
    }}>
      <div style={{ padding: "10px 14px 12px", borderBottom: "1px solid #f0ebe6" }}>
        <div style={{ fontWeight: 700, fontSize: 14, color: "#1a1210" }}>Sarah Mitchell</div>
        <div style={{ fontSize: 12, color: "#8a7968", marginTop: 2 }}>Lead Educator · Grade 4</div>
      </div>
      <div style={{ padding: "6px 0" }}>
        {items.map(item => (
          <div key={item} style={{
            padding: "9px 14px", borderRadius: 9, cursor: "pointer",
            fontSize: 14, fontWeight: 500, color: "#1a1210",
            transition: "background 0.12s",
          }}
            onMouseEnter={e => e.currentTarget.style.background = "#f8f5f2"}
            onMouseLeave={e => e.currentTarget.style.background = "transparent"}
          >
            {item}
          </div>
        ))}
      </div>
      <div style={{ borderTop: "1px solid #f0ebe6", padding: "6px 0 2px" }}>
        <div style={{
          padding: "9px 14px", borderRadius: 9, cursor: "pointer",
          fontSize: 14, fontWeight: 500, color: "#a51034",
          transition: "background 0.12s",
        }}
          onMouseEnter={e => e.currentTarget.style.background = "#fdf0f2"}
          onMouseLeave={e => e.currentTarget.style.background = "transparent"}
        >
          Sign Out
        </div>
      </div>
    </div>
  );
}

function Navbar({ activeTab, setActiveTab }) {
  const [profileOpen, setProfileOpen] = useState(false);
  const [mobileMenuOpen, setMobileMenuOpen] = useState(false);

  // Close mobile menu on tab select
  const handleTabSelect = (tab) => {
    setActiveTab(tab);
    setMobileMenuOpen(false);
  };

  return (
    <>
      <nav style={{
        position: "sticky", top: 0, zIndex: 100,
        background: "rgba(248,245,242,0.88)",
        backdropFilter: "blur(16px)",
        borderBottom: "1px solid rgba(214,195,165,0.3)",
      }}>
        <div style={{
          maxWidth: 1280, margin: "0 auto",
          padding: "0 24px",
          height: 64,
          display: "flex", alignItems: "center", gap: 16,
        }}>

          {/* Hamburger — mobile only */}
          <button
            className="hamburger-btn"
            onClick={() => setMobileMenuOpen(o => !o)}
            style={{
              display: "none",
              width: 38, height: 38, borderRadius: 10,
              background: "transparent",
              border: "1px solid rgba(214,195,165,0.5)",
              cursor: "pointer", alignItems: "center", justifyContent: "center",
              flexShrink: 0,
              transition: "background 0.15s",
            }}
            onMouseEnter={e => e.currentTarget.style.background = "rgba(214,195,165,0.2)"}
            onMouseLeave={e => e.currentTarget.style.background = "transparent"}
          >
            <svg width="16" height="16" viewBox="0 0 16 16" fill="none">
              {mobileMenuOpen ? (
                <>
                  <line x1="3" y1="3" x2="13" y2="13" stroke="#1a1210" strokeWidth="2" strokeLinecap="round"/>
                  <line x1="13" y1="3" x2="3" y2="13" stroke="#1a1210" strokeWidth="2" strokeLinecap="round"/>
                </>
              ) : (
                <>
                  <line x1="2" y1="4.5" x2="14" y2="4.5" stroke="#1a1210" strokeWidth="2" strokeLinecap="round"/>
                  <line x1="2" y1="8.5" x2="14" y2="8.5" stroke="#1a1210" strokeWidth="2" strokeLinecap="round"/>
                  <line x1="2" y1="12.5" x2="14" y2="12.5" stroke="#1a1210" strokeWidth="2" strokeLinecap="round"/>
                </>
              )}
            </svg>
          </button>

          {/* Logo — always visible, centered on mobile */}
          <div className="logo-wrapper" style={{ display: "contents" }}>
            <Logo />
          </div>

          {/* Nav Tabs — desktop center */}
          <div style={{ flex: 1, display: "flex", justifyContent: "center" }} className="desktop-tabs">
            <div style={{
              display: "flex", gap: 2,
              background: "rgba(214,195,165,0.25)",
              borderRadius: 99, padding: "4px",
              border: "1px solid rgba(214,195,165,0.4)",
              flexWrap: "nowrap", overflowX: "auto",
            }}>
              {navTabs.map(tab => (
                <button key={tab}
                  onClick={() => handleTabSelect(tab)}
                  style={{
                    padding: "7px 14px", borderRadius: 99, border: "none", cursor: "pointer",
                    fontSize: 13,
                    fontWeight: activeTab === tab ? 700 : 500,
                    color: activeTab === tab ? "white" : "#5a4a3a",
                    background: activeTab === tab ? "#a51034" : "transparent",
                    transition: "all 0.18s ease", whiteSpace: "nowrap",
                    fontFamily: "inherit", letterSpacing: "-0.01em",
                  }}
                  onMouseEnter={e => { if (activeTab !== tab) e.currentTarget.style.background = "rgba(164,16,52,0.08)"; }}
                  onMouseLeave={e => { if (activeTab !== tab) e.currentTarget.style.background = "transparent"; }}
                >
                  {tab}
                </button>
              ))}
            </div>
          </div>

          {/* Spacer on mobile to push profile right */}
          <div className="mobile-spacer" style={{ display: "none", flex: 1 }} />

          {/* Profile */}
          <div style={{ position: "relative", flexShrink: 0 }}>
            <button
              onClick={() => setProfileOpen(p => !p)}
              style={{
                width: 38, height: 38, borderRadius: 99,
                background: "#a51034", border: "none", cursor: "pointer",
                display: "flex", alignItems: "center", justifyContent: "center",
                boxShadow: "0 2px 8px rgba(164,16,52,0.25)",
                transition: "box-shadow 0.15s",
              }}
              onMouseEnter={e => e.currentTarget.style.boxShadow = "0 4px 16px rgba(164,16,52,0.35)"}
              onMouseLeave={e => e.currentTarget.style.boxShadow = "0 2px 8px rgba(164,16,52,0.25)"}
            >
              <span style={{ color: "white", fontWeight: 700, fontSize: 14, letterSpacing: "0.01em" }}>SM</span>
            </button>
            <ProfileMenu open={profileOpen} onClose={() => setProfileOpen(false)} />
          </div>
        </div>

        {/* Mobile drawer */}
        <div style={{
          overflow: "hidden",
          maxHeight: mobileMenuOpen ? 400 : 0,
          transition: "max-height 0.28s cubic-bezier(0.4,0,0.2,1)",
          borderTop: mobileMenuOpen ? "1px solid rgba(214,195,165,0.3)" : "none",
        }} className="mobile-drawer">
          <div style={{ padding: "8px 16px 16px", display: "flex", flexDirection: "column", gap: 2 }}>
            {navTabs.map(tab => (
              <button key={tab}
                onClick={() => handleTabSelect(tab)}
                style={{
                  padding: "13px 16px", borderRadius: 12, border: "none",
                  cursor: "pointer", textAlign: "left",
                  fontFamily: "inherit", fontSize: 15,
                  fontWeight: activeTab === tab ? 700 : 500,
                  color: activeTab === tab ? "#a51034" : "#1a1210",
                  background: activeTab === tab ? "rgba(164,16,52,0.06)" : "transparent",
                  transition: "background 0.15s",
                  letterSpacing: "-0.01em",
                }}
                onMouseEnter={e => { if (activeTab !== tab) e.currentTarget.style.background = "#f8f5f2"; }}
                onMouseLeave={e => { if (activeTab !== tab) e.currentTarget.style.background = "transparent"; }}
              >
                {tab}
              </button>
            ))}
          </div>
        </div>
      </nav>

      <style>{`
        @media (max-width: 768px) {
          .hero-text { flex: 0 0 100% !important; }

          .hamburger-btn { display: flex !important; }
          .desktop-tabs { display: none !important; }
          .mobile-spacer { display: block !important; }
          .logo-wrapper > div { position: absolute; left: 50%; transform: translateX(-50%); }
        }
        @media (min-width: 769px) {
          .mobile-drawer { display: none !important; }
        }
      `}</style>
    </>
  );
}

// Illustrated placeholder for hero image area
function HeroIllustration() {
  return (
    <svg viewBox="0 0 420 280" fill="none" xmlns="http://www.w3.org/2000/svg"
      style={{ width: "100%", height: "100%", opacity: 0.92 }}>

      <circle cx="285" cy="160" r="8" fill="#D6C3A5"/>

      {[0,1,2,3,4].map(i => (
        <text key={i} x={190 + i*14} y="52" fill={i < 4 ? "#D6C3A5" : "white"} fontSize="16" fillOpacity={i < 4 ? 1 : 0.3}>★</text>
      ))}
      <text x="130" y="55" fill="white" fontSize="11" fontFamily="Plus Jakarta Sans" fontWeight="500" fillOpacity="0.7">Student Rating</text>
      <text x="262" y="55" fill="white" fontSize="11" fontFamily="Plus Jakarta Sans" fontWeight="700" fillOpacity="0.85">4.2 / 5.0</text>
    </svg>
  );
}

function HeroBanner() {
  const l = todayLesson;
  const today = new Date().toLocaleDateString("en-US", { weekday: "long", month: "long", day: "numeric" });

  return (
    <div style={{ maxWidth: 1280, margin: "32px auto 0", padding: "0 24px" }}>
      <div style={{
        borderRadius: 24,
        background: "white",
        border: "1px solid rgba(214,195,165,0.45)",
        overflow: "hidden",
        position: "relative",
        minHeight: 300,
        display: "flex",
        boxShadow: "none",
      }}>
        {/* Left content */}
        <div className="hero-text" style={{
          flex: "0 0 55%", padding: "44px 48px",
          display: "flex", flexDirection: "column", justifyContent: "space-between",
          position: "relative", zIndex: 2,
        }}>
          <style>{`
            @media (max-width: 480px) {
              .hero-text { padding: 32px 24px !important; }
              .hero-inner { align-items: center !important; text-align: center !important; }
              .hero-meta-row { justify-content: center !important; }
              .hero-meta-items { align-items: center !important; }
              .hero-actions { justify-content: center !important; }
            }
          `}</style>
          <div className="hero-inner" style={{ display: "flex", flexDirection: "column", alignItems: "flex-start" }}>
            {/* Badge + Grade on same row */}
            <div className="hero-meta-row" style={{ display: "flex", alignItems: "center", gap: 10, marginBottom: 16, flexWrap: "wrap" }}>
              <div style={{
                background: "rgba(164,16,52,0.07)", border: "1px solid rgba(164,16,52,0.15)",
                borderRadius: 99, padding: "5px 14px",
                fontSize: 11, fontWeight: 700, color: "#a51034", letterSpacing: "0.08em", textTransform: "uppercase",
              }}>
                Next Lesson
              </div>
              <div style={{ fontSize: 13, fontWeight: 600, color: "#a51034", letterSpacing: "-0.01em" }}>
                {l.grade} · {l.subject}
              </div>
            </div>

            <h1 style={{
              fontSize: "clamp(22px, 3vw, 34px)",
              fontWeight: 800, color: "#1a1210",
              lineHeight: 1.18, letterSpacing: "-0.03em",
              marginBottom: 20, textWrap: "pretty",
            }}>
              {l.lessonName}
            </h1>

            <div className="hero-meta-items" style={{ display: "flex", flexDirection: "column", gap: 8 }}>
              {[
                { label: "Block", value: `${l.blockNumber} — ${l.blockName}` },
                { label: "Lesson", value: `${l.lessonNumber} of 8` },
                { label: "Duration", value: l.duration },
              ].map(({ label, value }) => (
                <div key={label} style={{ display: "flex", alignItems: "center", gap: 10 }}>
                  <span style={{ fontSize: 11, fontWeight: 700, color: "#8a7968", textTransform: "uppercase", letterSpacing: "0.08em", minWidth: 58 }}>{label}</span>
                  <span style={{ fontSize: 14, fontWeight: 500, color: "#1a1210" }}>{value}</span>
                </div>
              ))}
            </div>
          </div>

          <div className="hero-actions" style={{ display: "flex", gap: 10, marginTop: 32, flexWrap: "wrap" }}>
            <button style={{
              padding: "12px 24px", borderRadius: 99,
              background: "#a51034", color: "white",
              border: "none", cursor: "pointer",
              fontFamily: "inherit", fontWeight: 700, fontSize: 14,
              letterSpacing: "-0.01em",
              boxShadow: "0 4px 16px rgba(164,16,52,0.25)",
              transition: "transform 0.15s, box-shadow 0.15s",
            }}
              onMouseEnter={e => { e.currentTarget.style.transform = "translateY(-1px)"; e.currentTarget.style.boxShadow = "0 6px 24px rgba(164,16,52,0.35)"; }}
              onMouseLeave={e => { e.currentTarget.style.transform = "translateY(0)"; e.currentTarget.style.boxShadow = "0 4px 16px rgba(164,16,52,0.25)"; }}
            >
              Open Lesson Plan
            </button>
            <button style={{
              padding: "12px 24px", borderRadius: 99,
              background: "transparent", color: "#1a1210",
              border: "1px solid rgba(214,195,165,0.6)", cursor: "pointer",
              fontFamily: "inherit", fontWeight: 600, fontSize: 14,
              letterSpacing: "-0.01em",
              transition: "background 0.15s, border-color 0.15s",
            }}
              onMouseEnter={e => { e.currentTarget.style.background = "#f8f5f2"; e.currentTarget.style.borderColor = "rgba(164,16,52,0.2)"; }}
              onMouseLeave={e => { e.currentTarget.style.background = "transparent"; e.currentTarget.style.borderColor = "rgba(214,195,165,0.6)"; }}
            >
              Preview Materials
            </button>
          </div>
        </div>

        {/* Right — stock photo, hidden on mobile */}
        <div className="hero-image" style={{
          flex: "0 0 45%",
          position: "relative",
          overflow: "hidden",
        }}>
          {/* Gradient fade from left over photo */}
          <div style={{
            position: "absolute", left: 0, top: 0, bottom: 0, width: 100,
            background: "linear-gradient(to right, white, transparent)",
            zIndex: 1, pointerEvents: "none",
          }}/>
          <img
            src="https://images.unsplash.com/photo-1509062522246-3755977927d7?w=800&q=80"
            alt="Classroom lesson"
            style={{
              width: "100%", height: "100%",
              objectFit: "cover", objectPosition: "center",
              display: "block",
            }}
          />
        </div>
      </div>
    </div>
  );
}

function BlockProgressBar({ progress }) {
  return (
    <div>
      <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", marginBottom: 6 }}>
        <span style={{ fontSize: 11, fontWeight: 600, color: "#8a7968", letterSpacing: "0.04em", textTransform: "uppercase" }}>Block Progress</span>
        <span style={{ fontSize: 12, fontWeight: 700, color: "#a51034" }}>{progress}%</span>
      </div>
      <div style={{
        height: 5, borderRadius: 99,
        background: "rgba(214,195,165,0.35)",
        overflow: "hidden",
      }}>
        <div style={{
          height: "100%", borderRadius: 99,
          width: `${progress}%`,
          background: progress > 70 ? "#2d9e5a" : progress > 35 ? "#a51034" : "#c47a1a",
          transition: "width 0.6s ease",
        }}/>
      </div>
    </div>
  );
}

function LessonCard({ item }) {
  const [hovered, setHovered] = useState(false);
  const sc = subjectColors[item.subject] || defaultSubjectColor;
  return (
    <div
      onMouseEnter={() => setHovered(true)}
      onMouseLeave={() => setHovered(false)}
      style={{
        background: hovered ? "white" : "rgba(255,255,255,0.7)",
        border: `1px solid ${hovered ? sc.border : "rgba(214,195,165,0.4)"}`,
        borderRadius: 16, padding: "20px 22px",
        cursor: "pointer",
        transition: "all 0.18s ease",
        boxShadow: hovered ? `0 8px 28px ${sc.bg}, 0 1px 4px rgba(0,0,0,0.04)` : "0 1px 4px rgba(0,0,0,0.03)",
        transform: hovered ? "translateY(-2px)" : "translateY(0)",
      }}
    >
      <div style={{ display: "flex", justifyContent: "space-between", alignItems: "flex-start", marginBottom: 14 }}>
        <div>
          <div style={{ fontSize: 11, fontWeight: 700, color: sc.color, textTransform: "uppercase", letterSpacing: "0.07em", marginBottom: 4 }}>
            {item.subject}
          </div>
          <div style={{ fontSize: 15, fontWeight: 700, color: "#1a1210", lineHeight: 1.3, letterSpacing: "-0.02em", textWrap: "pretty" }}>
            {item.lessonName}
          </div>
        </div>
        <div style={{
          width: 32, height: 32, borderRadius: 10,
          background: sc.bg,
          display: "flex", alignItems: "center", justifyContent: "center",
          flexShrink: 0, marginLeft: 12,
        }}>
          <svg width="14" height="14" viewBox="0 0 14 14" fill="none">
            <path d="M5.5 3L9.5 7L5.5 11" stroke={sc.color} strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"/>
          </svg>
        </div>
      </div>

      <div style={{ display: "flex", gap: 14, marginBottom: 16, flexWrap: "wrap" }}>
        {[
          { l: "Block", v: item.blockNumber },
          { l: "Lesson", v: item.lessonNumber },
        ].map(({ l, v }) => (
          <div key={l} style={{ display: "flex", alignItems: "center", gap: 4 }}>
            <span style={{ fontSize: 11, color: "#8a7968", fontWeight: 500 }}>{l}</span>
            <span style={{
              fontSize: 11, fontWeight: 700, color: "#1a1210",
              background: "rgba(214,195,165,0.3)", borderRadius: 6,
              padding: "2px 7px",
            }}>{v}</span>
          </div>
        ))}
        <div style={{ fontSize: 11, color: "#8a7968", fontWeight: 400, alignSelf: "center" }}>
          {item.blockName}
        </div>
      </div>

      {/* Progress bar using subject color */}
      <div>
        <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", marginBottom: 6 }}>
          <span style={{ fontSize: 11, fontWeight: 600, color: "#8a7968", letterSpacing: "0.04em", textTransform: "uppercase" }}>Block Progress</span>
          <span style={{ fontSize: 12, fontWeight: 700, color: sc.color }}>{item.progress}%</span>
        </div>
        <div style={{ height: 5, borderRadius: 99, background: sc.bg, overflow: "hidden" }}>
          <div style={{
            height: "100%", borderRadius: 99,
            width: `${item.progress}%`,
            background: sc.color,
            transition: "width 0.6s ease",
          }}/>
        </div>
      </div>
    </div>
  );
}

function GradeSection({ group }) {
  return (
    <div>
      <div style={{ display: "flex", alignItems: "center", gap: 12, marginBottom: 16 }}>
        <div style={{
          width: 8, height: 8, borderRadius: 99,
          background: "#a51034",
        }}/>
        <h2 style={{ fontSize: 16, fontWeight: 800, color: "#1a1210", letterSpacing: "-0.02em" }}>
          {group.grade}
        </h2>
        <div style={{ height: 1, flex: 1, background: "rgba(214,195,165,0.5)" }}/>
        <span style={{ fontSize: 12, color: "#8a7968", fontWeight: 500 }}>
          {group.subjects.length} subjects
        </span>
      </div>
      <div style={{
        display: "grid",
        gridTemplateColumns: "repeat(auto-fill, minmax(280px, 1fr))",
        gap: 14,
      }}>
        {group.subjects.map(item => <LessonCard key={item.subject} item={item} />)}
      </div>
    </div>
  );
}

function UpcomingSection() {
  return (
    <section style={{ maxWidth: 1280, margin: "48px auto 0", padding: "0 24px 64px" }}>
      <div style={{ display: "flex", alignItems: "baseline", gap: 12, marginBottom: 32 }}>
        <h2 style={{ fontSize: 22, fontWeight: 800, color: "#1a1210", letterSpacing: "-0.03em" }}>
          Upcoming Lessons
        </h2>
        <span style={{ fontSize: 14, color: "#8a7968", fontWeight: 400 }}>by grade & subject</span>
      </div>
      <div style={{ display: "flex", flexDirection: "column", gap: 40 }}>
        {gradeSubjects.map(g => <GradeSection key={g.grade} group={g} />)}
      </div>
    </section>
  );
}

function QuickStats() {
  const stats = [
    { label: "Lessons This Week", value: "12", sub: "3 completed" },
    { label: "Active Grades", value: "3", sub: "Gr. 3, 4, 5" },
    { label: "Avg Block Progress", value: "48%", sub: "Across all subjects" },
    { label: "Students Engaged", value: "94", sub: "This morning" },
  ];
  return (
    <div style={{ maxWidth: 1280, margin: "28px auto 0", padding: "0 24px" }}>
      <div style={{
        display: "grid",
        gridTemplateColumns: "repeat(auto-fill, minmax(200px, 1fr))",
        gap: 14,
      }}>
        {stats.map(s => (
          <div key={s.label} style={{
            background: "rgba(255,255,255,0.7)",
            border: "1px solid rgba(214,195,165,0.4)",
            borderRadius: 16, padding: "18px 22px",
          }}>
            <div style={{ fontSize: 28, fontWeight: 800, color: "#1a1210", letterSpacing: "-0.03em", lineHeight: 1 }}>{s.value}</div>
            <div style={{ fontSize: 13, fontWeight: 600, color: "#1a1210", marginTop: 6, letterSpacing: "-0.01em" }}>{s.label}</div>
            <div style={{ fontSize: 12, color: "#8a7968", marginTop: 2 }}>{s.sub}</div>
          </div>
        ))}
      </div>
    </div>
  );
}

function ViewSwitcher({ view, setView }) {
  return (
    <div style={{
      position: "fixed", bottom: 28, left: "50%", transform: "translateX(-50%)",
      zIndex: 999,
      background: "rgba(26,18,16,0.88)",
      backdropFilter: "blur(12px)",
      borderRadius: 99,
      padding: "5px",
      display: "flex", gap: 2,
      boxShadow: "0 8px 32px rgba(0,0,0,0.22)",
    }}>
      {[
        { id: "web", label: "Web", icon: (
          <svg width="14" height="14" viewBox="0 0 14 14" fill="none">
            <rect x="1" y="2" width="12" height="9" rx="1.5" stroke="currentColor" strokeWidth="1.5"/>
            <line x1="4" y1="13" x2="10" y2="13" stroke="currentColor" strokeWidth="1.5" strokeLinecap="round"/>
            <line x1="7" y1="11" x2="7" y2="13" stroke="currentColor" strokeWidth="1.5" strokeLinecap="round"/>
          </svg>
        )},
        { id: "mobile", label: "Mobile", icon: (
          <svg width="14" height="14" viewBox="0 0 14 14" fill="none">
            <rect x="3.5" y="1" width="7" height="12" rx="1.5" stroke="currentColor" strokeWidth="1.5"/>
            <circle cx="7" cy="10.5" r="0.75" fill="currentColor"/>
          </svg>
        )},
      ].map(({ id, label, icon }) => (
        <button key={id} onClick={() => setView(id)} style={{
          display: "flex", alignItems: "center", gap: 6,
          padding: "8px 16px", borderRadius: 99, border: "none",
          cursor: "pointer", fontFamily: "inherit",
          fontSize: 13, fontWeight: 600,
          color: view === id ? "#1a1210" : "rgba(255,255,255,0.55)",
          background: view === id ? "white" : "transparent",
          transition: "all 0.18s ease",
        }}>
          {icon}
          {label}
        </button>
      ))}
    </div>
  );
}

function App() {
  const [activeTab, setActiveTab] = useState("Teacher Lesson Plan");
  const [view, setView] = useState("web");
  const isMobile = view === "mobile";

  return (
    <div style={{ background: isMobile ? "#e8e4e0" : "#F8F5F2", minHeight: "100vh", transition: "background 0.3s" }}>
      {isMobile && (
        <style>{`
          .hamburger-btn { display: flex !important; }
          .desktop-tabs { display: none !important; }
          .mobile-spacer { display: block !important; }
          .hero-image { display: none !important; }
          .hero-text { flex: 0 0 100% !important; }
          .logo-wrapper > div { position: absolute; left: 50%; transform: translateX(-50%); }
          .mobile-drawer { display: block !important; }
        `}</style>
      )}
      <div style={{
        ...(isMobile ? {
          maxWidth: 390,
          margin: "0 auto",
          background: "#F8F5F2",
          minHeight: "100vh",
          boxShadow: "0 0 0 1px rgba(0,0,0,0.08), 0 24px 80px rgba(0,0,0,0.18)",
          overflow: "hidden",
        } : {}),
        transition: "all 0.3s ease",
      }}>
        <Navbar activeTab={activeTab} setActiveTab={setActiveTab} />
        <main>
          <HeroBanner />
          <UpcomingSection />
        </main>
        <div style={{ height: 80 }} />
      </div>
      <ViewSwitcher view={view} setView={setView} />
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
</html>
